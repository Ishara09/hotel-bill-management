<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>Inedx</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: navy sidebar + sticky top bar + light accounting workspace. Navy and emerald from the brief; status colours are semantic. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --surface-2:#F8FAFC; --line:#E5E9F0; --line-2:#D5DBE6;
  --fg:#0F172A; --fg-2:#566178; --fg-3:#6B7589;
  --navy:#0B1F44; --navy-2:#1B3A75; --navy-line:#1F3562; --on-navy:#B8C3DA;
  --btn:#0B1F44; --btn-hover:#14306B; --btn-fg:#FFFFFF;
  --info-bg:#DBEAFE; --info-fg:#1D4ED8;
  --ok-bg:#D1FAE5; --ok-fg:#065F46; --ok:#059669;
  --warn-bg:#FFEDD5; --warn-fg:#9A3412; --warn:#F59E0B;
  --bad-bg:#FEE2E2; --bad-fg:#991B1B; --bad:#EF4444;
  --over:#991B1B; --over-fg:#FFFFFF;
  --income:#2563EB; --expense:#94A3B8; --accent:#10B981;
  --focus:#93C5FD; --overlay:rgba(8,16,36,.58);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 16px rgba(15,23,42,.05);
  --shadow-lg:0 24px 60px rgba(8,16,36,.28);
  --paper:#FFFFFF; --paper-fg:#111827; --paper-2:#4B5563; --paper-line:#D1D5DB; --paper-head:#0B1F44;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1020; --surface:#121A2E; --surface-2:#172139; --line:#222D47; --line-2:#2E3B5B;
  --fg:#E8EDF7; --fg-2:#A3AFC6; --fg-3:#8592AC;
  --navy:#070D1C; --navy-2:#1B2F5C; --navy-line:#18233F; --on-navy:#A9B6D0;
  --btn:#3A66CC; --btn-hover:#4A78E0; --btn-fg:#FFFFFF;
  --info-bg:rgba(59,130,246,.2); --info-fg:#93C5FD;
  --ok-bg:rgba(16,185,129,.18); --ok-fg:#6EE7B7; --ok:#34D399;
  --warn-bg:rgba(245,158,11,.18); --warn-fg:#FBBF24; --warn:#F59E0B;
  --bad-bg:rgba(239,68,68,.18); --bad-fg:#FCA5A5; --bad:#F87171;
  --over:#DC2626; --over-fg:#FFFFFF;
  --income:#60A5FA; --expense:#8592AC; --focus:#60A5FA; --overlay:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25); --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1020; --surface:#121A2E; --surface-2:#172139; --line:#222D47; --line-2:#2E3B5B;
  --fg:#E8EDF7; --fg-2:#A3AFC6; --fg-3:#8592AC;
  --navy:#070D1C; --navy-2:#1B2F5C; --navy-line:#18233F; --on-navy:#A9B6D0;
  --btn:#3A66CC; --btn-hover:#4A78E0; --btn-fg:#FFFFFF;
  --info-bg:rgba(59,130,246,.2); --info-fg:#93C5FD;
  --ok-bg:rgba(16,185,129,.18); --ok-fg:#6EE7B7; --ok:#34D399;
  --warn-bg:rgba(245,158,11,.18); --warn-fg:#FBBF24; --warn:#F59E0B;
  --bad-bg:rgba(239,68,68,.18); --bad-fg:#FCA5A5; --bad:#F87171;
  --over:#DC2626; --over-fg:#FFFFFF;
  --income:#60A5FA; --expense:#8592AC; --focus:#60A5FA; --overlay:rgba(0,0,0,.65);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 16px rgba(0,0,0,.25); --shadow-lg:0 24px 60px rgba(0,0,0,.6);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;letter-spacing:-.01em}
a{color:var(--info-fg)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{flex:0 0 auto;display:block}

/* boot + loading */
.boot{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--fg-2);font-weight:600;z-index:300}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
.spinner.sm{width:18px;height:18px;border-width:3px}
@keyframes spin{to{transform:rotate(360deg)}}
.busy{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:400}
.busy>div{background:var(--surface);border-radius:16px;padding:22px 28px;display:flex;align-items:center;gap:14px;font-weight:700;box-shadow:var(--shadow-lg)}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}*{scroll-behavior:auto!important}}

/* buttons */
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);color:var(--fg);font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--btn);border-color:var(--btn);color:var(--btn-fg)}
.btn-primary:hover{background:var(--btn-hover)}
.btn-danger{background:var(--over);border-color:var(--over);color:var(--over-fg)}
.btn-danger:hover{filter:brightness(1.08);background:var(--over)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{min-height:40px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-icon{width:40px;height:40px;min-height:40px;padding:0;border-radius:10px;border-color:transparent;background:transparent;color:var(--fg-2)}
.btn-icon:hover{background:var(--surface-2);color:var(--fg)}
.btn-icon.bad:hover{color:var(--bad-fg);background:var(--bad-bg)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--info-fg);font-weight:700;text-align:left;cursor:pointer}
.link:hover{text-decoration:underline}

/* shell */
.app{display:flex;min-height:100vh}
.sidebar{flex:0 0 248px;background:var(--navy);color:var(--on-navy);transition:flex-basis .18s}
.collapsed .sidebar{flex-basis:84px}
.sb-in{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;justify-content:space-between;gap:20px;padding:20px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand-mark{width:40px;height:40px;flex:0 0 40px;border-radius:12px;background:var(--accent);color:#04251A;display:flex;align-items:center;justify-content:center;overflow:hidden}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand b{display:block;color:#fff;font-size:17px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.brand small{display:block;color:var(--on-navy);font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:26px}
.nav-btn{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border:0;border-radius:12px;background:transparent;color:var(--on-navy);font-weight:600;font-size:14px;text-align:left;white-space:nowrap;width:100%}
.nav-btn:hover{background:rgba(255,255,255,.1)}
.nav-btn[aria-current="page"]{background:var(--navy-2);color:#fff}
.nav-btn .badge{margin-left:auto;background:var(--over);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px}
.sb-foot{border-top:1px solid var(--navy-line);padding-top:14px;display:flex;flex-direction:column;gap:4px}
.collapsed .nav-btn span,.collapsed .brand>div,.collapsed .nav-btn .badge{display:none}
.collapsed .nav-btn{justify-content:center;padding:0}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:12px}
.topbar h1{font-size:20px;font-weight:800;white-space:nowrap}
.tb-search{position:relative;flex:1 1 220px;max-width:420px;min-width:0}
.tb-search svg{position:absolute;left:14px;top:13px;color:var(--fg-3);pointer-events:none}
.tb-search input{width:100%;height:44px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 14px 0 42px}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:999px;background:var(--over);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--surface)}
.profile-btn{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px 0 5px;border:1px solid var(--line);background:var(--surface);border-radius:999px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--navy-2);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 34px}
.pf-text{display:flex;flex-direction:column;text-align:left;line-height:1.2}
.pf-text b{font-size:13px}.pf-text small{font-size:12px;color:var(--fg-2)}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:280px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);padding:8px;z-index:60}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:0 12px;border:0;background:transparent;border-radius:10px;font-weight:600;text-align:left}
.menu-item:hover{background:var(--surface-2)}
.menu-item.bad{color:var(--bad-fg)}
.menu-head{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu-head small{color:var(--fg-2);display:block}
.menu-list{max-height:360px;overflow-y:auto;display:flex;flex-direction:column}
.menu-row{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:10px 12px;border:0;background:transparent;border-radius:10px}
.menu-row:hover{background:var(--surface-2)}
.menu-row small{color:var(--fg-2)}
.search-menu{left:0;right:auto;width:min(480px,calc(100vw - 32px))}
.content{padding:24px;display:flex;flex-direction:column;gap:20px;width:100%;max-width:1560px}
.scrim{display:none}
.menu-btn-mobile{display:none}
@media (max-width:900px){
  .sidebar{position:fixed;inset:0 auto 0 0;width:272px;flex:none;z-index:70;transform:translateX(-102%);transition:transform .2s}
  .collapsed .sidebar{flex:none}
  .nav-open .sidebar{transform:none}
  .nav-open .scrim{display:block;position:fixed;inset:0;background:var(--overlay);z-index:65}
  .collapsed .nav-btn span,.collapsed .brand>div{display:revert}
  .collapsed .nav-btn{justify-content:flex-start;padding:0 14px}
  .topbar{padding:10px 16px;flex-wrap:wrap}
  .topbar h1{font-size:18px}
  .tb-search{order:5;flex:1 1 100%;max-width:none}
  .pf-text{display:none}.profile-btn{padding:0 5px}
  .content{padding:16px}
}

/* page pieces */
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.page-head h2{font-size:24px;font-weight:800;letter-spacing:-.02em}
.page-head p{margin:2px 0 0;color:var(--fg-2)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.card-h h3{font-size:16px;font-weight:800}
.card-h p{margin:0;color:var(--fg-2);font-size:13px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.grid.w2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.grid.w3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.kpis{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(215px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow);min-width:0}
.kpi-top{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--fg-2);font-weight:600;font-size:13px}
.chip{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.chip.info{background:var(--info-bg);color:var(--info-fg)}.chip.ok{background:var(--ok-bg);color:var(--ok-fg)}.chip.warn{background:var(--warn-bg);color:var(--warn-fg)}.chip.bad{background:var(--bad-bg);color:var(--bad-fg)}.chip.slate{background:var(--line);color:var(--fg-2)}
.kpi-val{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.15;white-space:nowrap}
.kpi-val small{display:block;font-size:12px;font-weight:700;color:var(--fg-2);margin-bottom:2px;letter-spacing:0}
.modal .kpi-val{font-size:22px}
.kpi-sub{font-size:12.5px;color:var(--fg-2);margin-top:3px}
.kpi.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.kpi.dark .kpi-top,.kpi.dark .kpi-sub,.kpi.dark .kpi-val small{color:var(--on-navy)}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--info-bg);color:var(--info-fg)}
.pill.paid,.pill.ok,.pill.active{background:var(--ok-bg);color:var(--ok-fg)}
.pill.partial,.pill.low,.pill.warn{background:var(--warn-bg);color:var(--warn-fg)}
.pill.unpaid,.pill.bad,.pill.voided{background:var(--bad-bg);color:var(--bad-fg)}
.pill.overdue,.pill.out{background:var(--over);color:var(--over-fg)}
.pill.inactive,.pill.muted{background:var(--line);color:var(--fg-2)}
.tag-demo{background:var(--info-bg);color:var(--info-fg);font-size:12px;font-weight:700;padding:5px 12px;border-radius:999px}

/* toolbar + filters */
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.toolbar .field{flex:1 1 150px;min-width:130px}
.toolbar .field.grow{flex:2 1 240px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:700}
.req{color:var(--bad-fg)}
.field input,.field select,.field textarea{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface);padding:0 14px;color:var(--fg)}
.field textarea{padding:10px 14px;min-height:92px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--info-fg)}
.field input[type=checkbox]{width:18px;height:18px;min-height:0;padding:0;accent-color:var(--btn)}
.field input[readonly]{background:var(--surface-2);color:var(--fg-2)}
.hint{font-size:12px;color:var(--fg-2)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--btn);margin:0}
.span-all{grid-column:1/-1}
.form-err{display:none;background:var(--bad-bg);color:var(--bad-fg);border:1px solid var(--bad);border-radius:12px;padding:10px 14px;font-weight:600;margin-bottom:14px}
.form-err.show{display:block}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--info-bg);color:var(--info-fg);border-radius:12px;padding:12px 14px;font-size:13px}
.note.warn{background:var(--warn-bg);color:var(--warn-fg)}
.note.bad{background:var(--bad-bg);color:var(--bad-fg)}
.note.ok{background:var(--ok-bg);color:var(--ok-fg)}

/* tables */
.tbl-wrap{overflow-x:auto;border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;min-width:760px}
.tbl th{position:relative;text-align:left;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--fg-2);background:var(--surface-2);padding:10px 14px;white-space:nowrap}
.tbl th:first-child{border-radius:10px 0 0 10px}.tbl th:last-child{border-radius:0 10px 10px 0}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tbody tr:hover td{background:var(--surface-2)}
.tbl tfoot td{font-weight:800;border-bottom:0;background:var(--surface-2)}
.tbl .num{text-align:right;white-space:nowrap}
.tbl .act{text-align:right;white-space:nowrap;width:1%}
.tbl .sub{display:block;font-size:12px;color:var(--fg-2)}
.th-sort{background:none;border:0;padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.th-sort:hover{color:var(--fg)}
.pager{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;font-size:13px;color:var(--fg-2)}
.pager .pg{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pg-btn{min-width:40px;height:40px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-weight:700}
.pg-btn[aria-current="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.pg-btn[disabled]{opacity:.45;cursor:not-allowed}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:44px 16px;color:var(--fg-2)}
.empty .chip{width:56px;height:56px;border-radius:16px}
.empty b{color:var(--fg);font-size:16px}
.empty p{margin:0;max-width:420px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{min-height:44px;padding:0 16px;background:none;border:0;border-bottom:3px solid transparent;font-weight:700;color:var(--fg-2)}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kv dt{font-size:12px;color:var(--fg-2);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kv dd{margin:2px 0 0;font-weight:600;overflow-wrap:anywhere}
.list-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.list-row:first-child{border-top:0}
.list-row .grow{flex:1;min-width:0}
.list-row small{display:block;color:var(--fg-2);font-size:12px}
.bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--fg-2);font-weight:600}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--fg-2);font-family:var(--font)}
.chart .gl{stroke:var(--line)}
.chart .strong{fill:var(--fg);font-weight:700}
.totals{margin-left:auto;width:min(100%,340px);display:flex;flex-direction:column;gap:6px}
.totals div{display:flex;justify-content:space-between;gap:16px}
.totals .grand{font-size:17px;font-weight:800;border-top:2px solid var(--line-2);padding-top:8px;margin-top:4px}
.totals .due{font-weight:800;color:var(--bad-fg)}
.line-row{display:grid;grid-template-columns:minmax(150px,2.2fr) minmax(130px,1.4fr) 90px 120px 120px 44px;gap:10px;align-items:end;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.line-row .amt{font-weight:800;min-height:44px;display:flex;align-items:center;justify-content:flex-end}
@media (max-width:760px){.line-row{grid-template-columns:1fr 1fr}.line-row .field:first-child{grid-column:1/-1}}

/* modals + toasts */
.backdrop{position:fixed;inset:0;background:var(--overlay);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:calc(3vh + env(safe-area-inset-top,0px)) 16px 3vh;overflow-y:auto}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:640px;box-shadow:var(--shadow-lg);border:1px solid var(--line);margin:auto 0}

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
'use strict';
/* ============================================================
   HotelBills: data layer, calculations, auth. No backend.
   Everything is stored in this browser (localStorage).
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((Number(n||0)+Number.EPSILON)*100)/100;
const r3=n=>Math.round((Number(n||0)+Number.EPSILON)*1000)/1000;
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)?n:0};
const sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const pad=(n,l)=>String(n).padStart(l,'0');
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const cmp=(a,b)=>a<b?-1:a>b?1:0;
const nowISO=()=>new Date().toISOString();

/* ---------- storage with safe fallbacks ---------- */
function makeStore(kind){
  const mem={};let s=null;
  try{s=window[kind];s.setItem('__t','1');s.removeItem('__t')}catch(e){s=null}
  return{ok:!!s,
    get(k){try{if(s){const v=s.getItem(k);if(v!=null)return v}}catch(e){}return k in mem?mem[k]:null},
    set(k,v){mem[k]=v;try{if(s){s.setItem(k,v);return true}}catch(e){}return false},
    del(k){delete mem[k];try{s&&s.removeItem(k)}catch(e){}}};
}
const LS=makeStore('localStorage'),SS=makeStore('sessionStorage');
const DB_KEY='hbms.data.v1',USERS_KEY='hbms.users.v1',SESS_KEY='hbms.session.v1',UI_KEY='hbms.ui.v1',FAIL_KEY='hbms.fail.v1';

/* ---------- settings + empty database ---------- */
function guessTz(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch(e){return 'UTC'}}
const CURRENCIES=['LKR','USD','EUR','GBP','INR','AUD','CAD','SGD','AED','MVR','THB','JPY','CNY','ZAR'];
const DATE_FORMATS=['DD MMM YYYY','DD/MM/YYYY','MM/DD/YYYY','YYYY-MM-DD'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function tzList(){let l=[];try{l=Intl.supportedValuesOf('timeZone')}catch(e){}if(!l.length)l=['UTC','Asia/Colombo','Asia/Kolkata','Asia/Dubai','Asia/Singapore','Europe/London','Europe/Paris','America/New_York','America/Los_Angeles','Australia/Sydney'];if(l.indexOf('UTC')<0)l=['UTC'].concat(l);return l}
function defaultSettings(){return{
  business:{name:'My Hotel',address:'',phone:'',email:'',taxId:'',logo:''},
  currency:'LKR',dateFormat:'DD MMM YYYY',timezone:guessTz(),
  taxName:'VAT',taxRate:0,
  methods:['Cash','Bank transfer','Card','Cheque','Other'],
  billPrefix:'INV',billNext:1,payPrefix:'PAY',payNext:1,
  termsDays:30,terms:'Please pay by the due date. Quote the bill number with every payment.',
  lowStock:10,openingCash:0,openingBank:0,lastBackup:''}}
function blankDb(){return{v:1,demo:false,settings:defaultSettings(),billers:[],bills:[],payments:[],stock:[],moves:[],txns:[],audit:[],
  categories:{income:['Room revenue','Restaurant and bar','Events and banquets','Other income'],
    expense:['Salaries','Utilities','Maintenance','Marketing','Taxes and fees','Other expense'],
    stock:['Linen','Toiletries','Food and beverage','Cleaning','Maintenance','Other']}}}

let db=null,users=[],me=null,IX=null;

function loadDb(){
  try{const raw=LS.get(DB_KEY);if(raw){const d=JSON.parse(raw);const b=blankDb();db=Object.assign(b,d);db.settings=Object.assign(defaultSettings(),d.settings||{});db.settings.business=Object.assign(defaultSettings().business,(d.settings||{}).business||{});db.categories=Object.assign(b.categories,d.categories||{})}else db=blankDb()}
  catch(e){db=blankDb()}
  reindex();
}
let saveWarned=false;
function save(){const ok=LS.set(DB_KEY,JSON.stringify(db));if(!ok&&!saveWarned){saveWarned=true;toast(LS.ok?'The browser storage is full. Export a backup in Settings, then remove old data.':'This browser blocks storage, so changes will be lost when the tab closes. Export a backup in Settings.','err')}}
function loadUsers(){try{users=JSON.parse(LS.get(USERS_KEY)||'[]')}catch(e){users=[]}}
function saveUsers(){LS.set(USERS_KEY,JSON.stringify(users))}

/* ---------- dates, money ---------- */
function todayISO(){try{return new Intl.DateTimeFormat('en-CA',{timeZone:db&&db.settings.timezone||undefined}).format(new Date())}catch(e){return new Date().toISOString().slice(0,10)}}
function addDays(iso,n){const d=new Date(iso+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function diffDays(a,b){return Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5)}
function monthStart(iso){return iso.slice(0,7)+'-01'}
function addMonths(iso,n){const y=+iso.slice(0,4),m=+iso.slice(5,7)-1+n;const d=new Date(Date.UTC(y,m,1));return d.toISOString().slice(0,10)}
function fdate(iso){if(!iso)return '-';const p=String(iso).slice(0,10).split('-');if(p.length<3)return iso;const[y,m,d]=p;switch(db.settings.dateFormat){case 'DD/MM/YYYY':return d+'/'+m+'/'+y;case 'MM/DD/YYYY':return m+'/'+d+'/'+y;case 'YYYY-MM-DD':return iso.slice(0,10);default:return d+' '+MONTHS[+m-1]+' '+y}}
function fdatetime(iso){if(!iso)return '-';try{const d=new Date(iso);const day=new Intl.DateTimeFormat('en-CA',{timeZone:db.settings.timezone}).format(d);const t=new Intl.DateTimeFormat('en-GB',{timeZone:db.settings.timezone,hour:'2-digit',minute:'2-digit'}).format(d);return fdate(day)+' '+t}catch(e){return fdate(iso.slice(0,10))}}
let NF=null,NFkey='';
function nf(){const k=db.settings.currency;if(!NF||NFkey!==k){let dec=2;try{dec=new Intl.NumberFormat('en-US',{style:'currency',currency:k}).resolvedOptions().maximumFractionDigits}catch(e){}NF=new Intl.NumberFormat('en-US',{minimumFractionDigits:dec,maximumFractionDigits:dec});NFkey=k}return NF}
const money=n=>db.settings.currency+' '+nf().format(r2(n));
const mnum=n=>nf().format(r2(n));
const qfmt=n=>String(r3(n));

/* ---------- audit ---------- */
function log(action,entity,id,summary){
  db.audit.unshift({id:uid('a'),at:nowISO(),user:me?me.name:'System',role:me?me.role:'',action,entity,entityId:id,summary});
  if(db.audit.length>3000)db.audit.length=3000;
}

/* ---------- permissions ---------- */
const STAFF_CAN=['bill.write','biller.write','payment.write','stock.write','txn.write','report.view'];
const can=a=>!!me&&(me.role==='admin'||STAFF_CAN.indexOf(a)>=0);
const isAdmin=()=>!!me&&me.role==='admin';

/* ---------- bill calculations ---------- */
function calc(b){
  const items=b.items||[];
  const sub=r2(sum(items,i=>r2(num(i.qty)*num(i.price))));
  const dv=Math.max(0,num(b.discount));
  const dAmt=b.discountType==='pct'?r2(sub*Math.min(dv,100)/100):r2(Math.min(dv,sub));
  const taxable=r2(sub-dAmt);
  const tax=r2(taxable*Math.max(0,num(b.taxPct))/100);
  return{sub,dAmt,taxable,tax,total:r2(taxable+tax)};
}
function reindex(){
  const today=todayISO();
  const byBill={};
  db.payments.forEach(p=>{if(!p.voided)(byBill[p.billId]=byBill[p.billId]||[]).push(p)});
  const bills={};
  db.bills.forEach(b=>{
    const c=calc(b),ps=byBill[b.id]||[],paid=r2(sum(ps,p=>p.amount)),bal=r2(c.total-paid);
    let status;
    if(bal<=0.004)status='Paid';else if(b.dueDate&&b.dueDate<today)status='Overdue';else if(paid>0)status='Partially Paid';else status='Unpaid';
    bills[b.id]=Object.assign({},c,{paid,bal,status,payments:ps,daysOver:status==='Overdue'?diffDays(b.dueDate,today):0});
  });
  const billers={};
  db.billers.forEach(x=>billers[x.id]={billed:0,paid:0,bal:0,count:0});
  db.bills.forEach(b=>{const i=bills[b.id],s=billers[b.billerId];if(s){s.billed=r2(s.billed+i.total);s.paid=r2(s.paid+i.paid);s.bal=r2(s.bal+i.bal);s.count++}});
  IX={bills,billers,today};
}
const bi=b=>IX.bills[b.id];
const billerOf=id=>db.billers.find(x=>x.id===id);
const billOf=id=>db.bills.find(x=>x.id===id);
const itemOf=id=>db.stock.find(x=>x.id===id);
const statusClass=s=>({'Paid':'paid','Partially Paid':'partial','Unpaid':'unpaid','Overdue':'overdue'}[s]||'');
function pill(s){return `<span class="pill ${statusClass(s)}">${esc(s)}</span>`}

/* ---------- stock helpers ---------- */
const stockValue=it=>r2(num(it.qty)*num(it.cost));
function stockState(it){const min=num(it.min)>0?num(it.min):num(db.settings.lowStock);if(num(it.qty)<=0)return 'out';if(num(it.qty)<=min)return 'low';return 'ok'}
function stockMin(it){return num(it.min)>0?num(it.min):num(db.settings.lowStock)}
function moveStock(itemId,type,qty,o){
  o=o||{};const it=itemOf(itemId);if(!it)return{error:'Stock item not found.'};
  qty=num(qty);let delta;
  if(type==='purchase'){if(!(qty>0))return{error:'Enter a quantity greater than zero.'};delta=qty}
  else if(type==='usage'){if(!(qty>0))return{error:'Enter a quantity greater than zero.'};if(qty>num(it.qty)+1e-9)return{error:'Only '+qfmt(it.qty)+' '+it.unit+' available.'};delta=-qty}
  else{if(qty<0)return{error:'The counted quantity cannot be negative.'};delta=r3(qty-num(it.qty));if(delta===0)return{error:'The counted quantity matches the current quantity.'}}
  let uc=null;
  if(type==='purchase'&&o.unitCost!=null&&o.unitCost!==''&&num(o.unitCost)>=0){uc=r2(num(o.unitCost));const oldV=num(it.qty)*num(it.cost),newV=qty*uc;it.cost=r2((oldV+newV)/(num(it.qty)+qty))}
  it.qty=r3(num(it.qty)+delta);it.updatedAt=nowISO();
  const m={id:uid('m'),itemId,date:o.date||todayISO(),type,qty:delta,unitCost:uc,ref:o.ref||'',billId:o.billId||'',note:o.note||'',by:me?me.name:'System',balance:it.qty,at:nowISO()};
  db.moves.push(m);
  log(type,'stock',itemId,(type==='purchase'?'Purchased ':type==='usage'?'Used ':'Adjusted ')+qfmt(Math.abs(delta))+' '+it.unit+' of '+it.name);
  return{ok:true,move:m};
}

/* ---------- bills ---------- */
function nextBillNo(date){const s=db.settings;return s.billPrefix+'-'+(date||todayISO()).slice(0,4)+'-'+pad(s.billNext,4)}
function nextPayRef(){const s=db.settings;return s.payPrefix+'-'+pad(s.payNext,4)}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(Date.parse(s))}
function cleanItems(items){return(items||[]).map(i=>({desc:String(i.desc||'').trim(),stockId:i.stockId||'',qty:r3(num(i.qty)),price:r2(num(i.price))}))}
function validateBill(d,id){
  if(!d.billerId||!billerOf(d.billerId))return 'Choose a biller.';
  if(!validDate(d.billDate))return 'Enter a valid bill date.';
  if(!validDate(d.dueDate))return 'Enter a valid due date.';
  if(d.dueDate<d.billDate)return 'The due date cannot be before the bill date.';
  const items=cleanItems(d.items);
  if(!items.length)return 'Add at least one line item.';
  for(let i=0;i<items.length;i++){
    if(!items[i].desc)return 'Line '+(i+1)+' needs a description.';
    if(!(items[i].qty>0))return 'Line '+(i+1)+' needs a quantity greater than zero.';
    const raw=d.items[i];if(num(raw.price)<0)return 'Line '+(i+1)+' has a negative unit price.';
  }
  if(num(d.discount)<0)return 'The discount cannot be negative.';
  if(d.discountType==='pct'&&num(d.discount)>100)return 'A percentage discount cannot exceed 100.';
  if(d.discountType!=='pct'&&num(d.discount)>calc({items}).sub+1e-9)return 'The discount cannot be more than the subtotal.';
  const t=num(d.taxPct);if(t<0||t>100)return 'Tax must be between 0 and 100 percent.';
  if(id){const b=billOf(id),paid=bi(b).paid,total=calc(Object.assign({},d,{items})).total;if(total+0.004<paid)return 'The new total ('+money(total)+') is less than the '+money(paid)+' already paid. Void a payment first.'}
  return '';
}
function snapBiller(id){const x=billerOf(id)||{};return{name:x.name||'',company:x.company||'',contact:x.contact||'',phone:x.phone||'',email:x.email||'',address:x.address||'',taxId:x.taxId||''}}
function saveBill(d,id,opts){
  opts=opts||{};const err=validateBill(d,id);if(err)return{error:err};
  const items=cleanItems(d.items),now=nowISO(),who=me?me.name:'System';
  const fields={billDate:d.billDate,dueDate:d.dueDate,billerId:d.billerId,biller:snapBiller(d.billerId),description:String(d.description||'').trim(),items,discount:r2(num(d.discount)),discountType:d.discountType==='pct'?'pct':'amt',taxPct:r2(num(d.taxPct)),method:d.method||'',notes:String(d.notes||'').trim()};
  let b;
  if(id){
    b=billOf(id);const before=bi(b).total;Object.assign(b,fields);b.updatedAt=now;b.updatedBy=who;
    log('update','bill',b.id,'Updated bill '+b.no+' (total '+money(before)+' to '+money(calc(b).total)+')');
  }else{
    let no=nextBillNo(d.billDate);while(db.bills.some(x=>x.no===no)){db.settings.billNext++;no=nextBillNo(d.billDate)}
    b=Object.assign({id:uid('b'),no,stockApplied:false,stockLines:[],createdAt:now,createdBy:who,updatedAt:now,updatedBy:who},fields);
    db.bills.push(b);db.settings.billNext++;
    log('create','bill',b.id,'Created bill '+b.no+' for '+b.biller.name+' ('+money(calc(b).total)+')');
  }
  if(d.addToStock&&!b.stockApplied){
    const lines=items.filter(i=>i.stockId&&itemOf(i.stockId));
    lines.forEach(i=>moveStock(i.stockId,'purchase',i.qty,{unitCost:i.price,date:b.billDate,ref:b.no,billId:b.id,note:'Received on bill '+b.no}));
    if(lines.length){b.stockApplied=true;b.stockLines=lines.map(i=>({stockId:i.stockId,qty:i.qty}))}
  }
  reindex();if(!opts.silent)save();
  return{ok:true,bill:b};
}
function deleteBill(id){
  const b=billOf(id);if(!b)return{error:'Bill not found.'};
  if(!isAdmin())return{error:'Only administrators can delete bills.'};
  if(bi(b).payments.length)return{error:'This bill has recorded payments. Void them first, or keep the bill for your records.'};
  if(b.stockApplied){(b.stockLines||[]).forEach(l=>{const it=itemOf(l.stockId);if(it){const q=Math.min(l.qty,num(it.qty));if(q>0)moveStock(l.stockId,'usage',q,{ref:b.no,note:'Reversed: bill '+b.no+' deleted'})}})}
  db.payments=db.payments.filter(p=>p.billId!==id);
  db.bills=db.bills.filter(x=>x.id!==id);
  log('delete','bill',id,'Deleted bill '+b.no);
  reindex();save();return{ok:true};
}

/* ---------- billers ---------- */
function saveBiller(d,id){
  const name=String(d.name||'').trim();if(!name)return{error:'Enter the biller or supplier name.'};
  const email=String(d.email||'').trim();if(email&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return{error:'Enter a valid email address.'};
  const dup=db.billers.find(x=>x.id!==id&&x.name.trim().toLowerCase()===name.toLowerCase());if(dup)return{error:'A biller named "'+dup.name+'" already exists.'};
  const f={name,company:String(d.company||'').trim(),contact:String(d.contact||'').trim(),phone:String(d.phone||'').trim(),email,address:String(d.address||'').trim(),taxId:String(d.taxId||'').trim(),bank:String(d.bank||'').trim(),notes:String(d.notes||'').trim(),status:d.status==='inactive'?'inactive':'active'};
  let b;
  if(id){b=billerOf(id);Object.assign(b,f);b.updatedAt=nowISO();log('update','biller',id,'Updated biller '+b.name)}
  else{const n=db.billers.reduce((m,x)=>Math.max(m,parseInt(String(x.code).replace(/\D/g,''),10)||0),0)+1;b=Object.assign({id:uid('r'),code:'BLR-'+pad(n,3),createdAt:nowISO(),updatedAt:nowISO()},f);db.billers.push(b);log('create','biller',b.id,'Added biller '+b.name)}
  reindex();save();return{ok:true,biller:b};
}
function deleteBiller(id){
  if(!isAdmin())return{error:'Only administrators can delete billers.'};
  const b=billerOf(id);if(!b)return{error:'Biller not found.'};
  if(db.bills.some(x=>x.billerId===id)||db.stock.some(x=>x.billerId===id))return{error:'This biller is linked to bills or stock. Deactivate it instead.'};
  db.billers=db.billers.filter(x=>x.id!==id);log('delete','biller',id,'Deleted biller '+b.name);reindex();save();return{ok:true};
}

/* ---------- payments ---------- */
function savePayment(d,id){
  const b=billOf(d.billId);if(!b)return{error:'Choose a bill.'};
  const amount=r2(num(d.amount));if(!(amount>0))return{error:'Enter a payment amount greater than zero.'};
  if(!validDate(d.date))return{error:'Enter a valid payment date.'};
  if(!d.method)return{error:'Choose a payment method.'};
  let allowed=bi(b).bal,p=null;
  if(id){p=db.payments.find(x=>x.id===id);if(!p)return{error:'Payment not found.'};if(p.voided)return{error:'Voided payments cannot be edited.'};allowed=r2(allowed+p.amount)}
  if(amount>allowed+0.004)return{error:'The payment is more than the outstanding balance of '+money(allowed)+'.'};
  const f={date:d.date,amount,method:d.method,txRef:String(d.txRef||'').trim(),by:String(d.by||'').trim(),notes:String(d.notes||'').trim()};
  if(id){
    const ch=[];['date','amount','method','txRef','by','notes'].forEach(k=>{if(String(p[k]==null?'':p[k])!==String(f[k]))ch.push({f:k,from:p[k],to:f[k]})});
    if(!ch.length)return{ok:true,payment:p,unchanged:true};
    p.history=(p.history||[]).concat([{at:nowISO(),by:me?me.name:'System',changes:ch}]);Object.assign(p,f);p.updatedAt=nowISO();
    log('update','payment',p.id,'Edited payment '+p.ref+' on '+b.no+' ('+ch.map(c=>c.f).join(', ')+')');
  }else{
    while(db.payments.some(x=>x.ref===nextPayRef()))db.settings.payNext++;
    p=Object.assign({id:uid('p'),ref:nextPayRef(),billId:b.id,voided:false,history:[],createdAt:nowISO(),createdBy:me?me.name:'System',updatedAt:nowISO()},f);
    db.payments.push(p);db.settings.payNext++;
    log('create','payment',p.id,'Recorded payment '+p.ref+' of '+money(amount)+' on '+b.no);
  }
  reindex();save();return{ok:true,payment:p};
}
function voidPayment(id,reason){
  if(!isAdmin())return{error:'Only administrators can reverse payments.'};
  const p=db.payments.find(x=>x.id===id);if(!p||p.voided)return{error:'Payment not found.'};
  p.voided=true;p.voidedAt=nowISO();p.voidedBy=me.name;p.voidReason=String(reason||'').trim();
  p.history=(p.history||[]).concat([{at:nowISO(),by:me.name,changes:[{f:'status',from:'Recorded',to:'Voided'}]}]);
  const b=billOf(p.billId);log('void','payment',p.id,'Reversed payment '+p.ref+(b?' on '+b.no:'')+(reason?' ('+reason+')':''));
  reindex();save();return{ok:true};
}

/* ---------- stock items ---------- */
function saveStockItem(d,id){
  const name=String(d.name||'').trim();if(!name)return{error:'Enter the item name.'};
  if(!String(d.unit||'').trim())return{error:'Enter a unit of measurement.'};
  if(num(d.min)<0||num(d.cost)<0||num(d.price)<0||num(d.qty)<0)return{error:'Quantities and prices cannot be negative.'};
  const sku=String(d.sku||'').trim();
  if(sku&&db.stock.some(x=>x.id!==id&&x.sku.toLowerCase()===sku.toLowerCase()))return{error:'Another item already uses the code '+sku+'.'};
  const f={name,sku,category:d.category||'Other',description:String(d.description||'').trim(),unit:String(d.unit).trim(),min:r3(num(d.min)),cost:r2(num(d.cost)),price:r2(num(d.price)),billerId:d.billerId||''};
  let it;
  if(id){it=itemOf(id);Object.assign(it,f);it.updatedAt=nowISO();log('update','stock',id,'Updated item '+it.name)}
  else{
    const n=db.stock.reduce((m,x)=>Math.max(m,parseInt(String(x.code).replace(/\D/g,''),10)||0),0)+1;
    it=Object.assign({id:uid('s'),code:'ITM-'+pad(n,3),qty:0,createdAt:nowISO(),updatedAt:nowISO()},f);db.stock.push(it);log('create','stock',it.id,'Added stock item '+it.name);
    if(num(d.qty)>0){it.qty=0;moveStock(it.id,'adjustment',num(d.qty),{note:'Opening quantity'})}
  }
  save();return{ok:true,item:it};
}

/* ---------- cash transactions ---------- */
const acctOf=m=>m==='Cash'?'Cash':'Bank';
function saveTxn(d,id){
  const type=d.type;if(['income','expense','transfer','adjustment'].indexOf(type)<0)return{error:'Choose a transaction type.'};
  if(!validDate(d.date))return{error:'Enter a valid date.'};
  let amt=r2(num(d.amount));
  if(type==='adjustment'){if(amt===0)return{error:'Enter an adjustment amount other than zero. Use a negative number to reduce cash.'}}
  else if(!(amt>0))return{error:'Enter an amount greater than zero.'};
  if(type==='transfer'&&d.account===d.toAccount)return{error:'Choose two different accounts for a transfer.'};
  if(!String(d.description||'').trim())return{error:'Enter a description.'};
  const f={type,date:d.date,category:d.category||'',description:String(d.description).trim(),amount:amt,method:d.method||'',account:d.account||'Cash',toAccount:type==='transfer'?d.toAccount:'',ref:String(d.ref||'').trim(),notes:String(d.notes||'').trim()};
  let t;
  if(id){t=db.txns.find(x=>x.id===id);if(!t)return{error:'Transaction not found.'};Object.assign(t,f);t.updatedAt=nowISO();log('update','cash',id,'Edited '+type+' of '+money(amt))}
  else{const n=db.txns.length?Math.max.apply(null,db.txns.map(x=>parseInt(String(x.code).replace(/\D/g,''),10)||0))+1:1;t=Object.assign({id:uid('t'),code:'TXN-'+pad(n,4),by:me?me.name:'System',createdAt:nowISO(),updatedAt:nowISO()},f);db.txns.push(t);log('create','cash',t.id,'Recorded '+type+' of '+money(amt)+': '+f.description)}
  save();return{ok:true,txn:t};
}
function deleteTxn(id){
  if(!isAdmin())return{error:'Only administrators can delete transactions.'};
  const t=db.txns.find(x=>x.id===id);if(!t)return{error:'Transaction not found.'};
  db.txns=db.txns.filter(x=>x.id!==id);log('delete','cash',id,'Deleted '+t.type+' of '+money(t.amount)+': '+t.description);save();return{ok:true};
}

/* ---------- cash flow ledger (payments are the source for bill money) ---------- */
function ledger(){
  const bills={},billers={};db.bills.forEach(b=>bills[b.id]=b);db.billers.forEach(x=>billers[x.id]=x);
  const rows=[];
  db.payments.forEach(p=>{if(p.voided)return;const b=bills[p.billId];
    rows.push({id:p.id,src:'payment',code:p.ref,date:p.date,type:'expense',cat:'Bill payment',desc:'Payment of '+(b?b.no:'deleted bill')+' to '+(b?b.biller.name:''),amt:p.amount,method:p.method,account:acctOf(p.method),toAccount:'',ref:p.txRef||p.ref,by:p.by||p.createdBy,notes:p.notes})});
  db.txns.forEach(t=>rows.push({id:t.id,src:'manual',code:t.code,date:t.date,type:t.type,cat:t.category,desc:t.description,amt:t.amount,method:t.method,account:t.account,toAccount:t.toAccount,ref:t.ref,by:t.by,notes:t.notes}));
  return rows.sort((a,b)=>cmp(a.date,b.date)||cmp(a.code,b.code));
}
function flow(r){return r.type==='income'?r.amt:r.type==='expense'?-r.amt:r.type==='adjustment'?r.amt:0}
function acctFlow(r,a){if(r.type==='transfer')return(r.account===a?-r.amt:0)+(r.toAccount===a?r.amt:0);return r.account===a?flow(r):0}
function cashSummary(from,to,L){
  L=L||ledger();let open=r2(num(db.settings.openingCash)+num(db.settings.openingBank));
  const inP=[];
  L.forEach(r=>{if(from&&r.date<from)open+=flow(r);else if(!to||r.date<=to)inP.push(r)});
  let inflow=0,outflow=0,income=0,expense=0;
  inP.forEach(r=>{const f=flow(r);if(f>0)inflow+=f;else outflow-=f;if(r.type==='income')income+=r.amt;if(r.type==='expense')expense+=r.amt});
  open=r2(open);inflow=r2(inflow);outflow=r2(outflow);
  return{open,inflow,outflow,income:r2(income),expense:r2(expense),net:r2(inflow-outflow),close:r2(open+inflow-outflow),rows:inP};
}
function accountBalance(a,upto,L){
  L=L||ledger();let b=num(a==='Cash'?db.settings.openingCash:db.settings.openingBank);
  L.forEach(r=>{if(!upto||r.date<=upto)b+=acctFlow(r,a)});return r2(b);
}
function periodKey(date,g){if(g==='day')return date;if(g==='month')return date.slice(0,7);if(g==='year')return date.slice(0,4);const wd=(new Date(date+'T00:00:00Z').getUTCDay()+6)%7;return addDays(date,-wd)}
function periodLabel(k,g){if(g==='day')return fdate(k);if(g==='month')return MONTHS[+k.slice(5,7)-1]+' '+k.slice(0,4);if(g==='year')return k;return 'Week of '+fdate(k)}

/* ---------- auth (local accounts, PBKDF2 hashed) ---------- */
const b64=buf=>{let s='';new Uint8Array(buf).forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function fallbackHash(pw,salt){let h1=0xdeadbeef,h2=0x41c6ce57;const s=salt+pw;for(let r=0;r<2000;r++){for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909)}return 'f'+(h2>>>0).toString(16)+(h1>>>0).toString(16)}
async function hashPw(pw,salt){
  try{if(window.crypto&&crypto.subtle){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(salt),iterations:150000,hash:'SHA-256'},k,256);return b64(bits)}}catch(e){}
  return fallbackHash(pw,salt);
}
const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));
function newRecoveryCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const b=crypto.getRandomValues(new Uint8Array(16));let s='';for(let i=0;i<16;i++){s+=A[b[i]%A.length];if(i%4===3&&i<15)s+='-'}return s}
function pwProblem(pw){if(pw.length<8)return 'Use at least 8 characters.';if(!/[A-Za-z]/.test(pw)||!/\d/.test(pw))return 'Use letters and at least one number.';return ''}
async function createUser(d){
  const email=String(d.email||'').trim().toLowerCase();
  if(!String(d.name||'').trim())return{error:'Enter a name.'};
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)&&!/^[a-z0-9._-]{3,}$/.test(email))return{error:'Enter a valid email address or username.'};
  if(users.some(u=>u.email===email))return{error:'An account with that email or username already exists.'};
  const pe=pwProblem(d.password||'');if(pe)return{error:pe};
  const salt=newSalt(),code=newRecoveryCode(),rsalt=newSalt();
  const u={id:uid('u'),name:String(d.name).trim(),email,role:d.role==='admin'?'admin':'staff',active:true,salt,hash:await hashPw(d.password,salt),rsalt,rhash:await hashPw(code.replace(/-/g,''),rsalt),createdAt:nowISO()};
  users.push(u);saveUsers();return{ok:true,user:u,code};
}
function failState(){try{return JSON.parse(LS.get(FAIL_KEY)||'{}')}catch(e){return{}}}
function lockedFor(){const f=failState();return f.until&&f.until>Date.now()?Math.ceil((f.until-Date.now())/1000):0}
function noteFail(){const f=failState();f.n=(f.n||0)+1;if(f.n>=5){f.until=Date.now()+60000;f.n=0}LS.set(FAIL_KEY,JSON.stringify(f))}
async function doLogin(id,pw,remember){
  const wait=lockedFor();if(wait)return{error:'Too many attempts. Try again in '+wait+' seconds.'};
  const u=users.find(x=>x.email===String(id||'').trim().toLowerCase());
  const bad={error:'The email or password is incorrect.'};
  if(!u){await hashPw(pw||'x',newSalt());noteFail();return bad}
  const h=await hashPw(pw||'',u.salt);
  if(h!==u.hash){noteFail();return bad}
  if(!u.active)return{error:'This account is deactivated. Ask an administrator.'};
  LS.del(FAIL_KEY);startSession(u,remember);return{ok:true};
}
function startSession(u,remember){
  const s=JSON.stringify({uid:u.id,exp:Date.now()+(remember?30*864e5:12*36e5),remember:!!remember});
  (remember?LS:SS).set(SESS_KEY,s);(remember?SS:LS).del(SESS_KEY);me=u;
}
function restoreSession(){
  const raw=SS.get(SESS_KEY)||LS.get(SESS_KEY);if(!raw)return false;
  try{const s=JSON.parse(raw);if(s.exp<Date.now())throw 0;const u=users.find(x=>x.id===s.uid&&x.active);if(!u)throw 0;me=u;return true}catch(e){endSession();return false}
}
function endSession(){SS.del(SESS_KEY);LS.del(SESS_KEY);me=null}
async function recoverPassword(email,code,pw){
  const wait=lockedFor();if(wait)return{error:'Too many attempts. Try again in '+wait+' seconds.'};
  const u=users.find(x=>x.email===String(email||'').trim().toLowerCase());
  const bad={error:'The email or recovery code does not match.'};
  if(!u){noteFail();return bad}
  const h=await hashPw(String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,''),u.rsalt);
  if(h!==u.rhash){noteFail();return bad}
  const pe=pwProblem(pw||'');if(pe)return{error:pe};
  u.salt=newSalt();u.hash=await hashPw(pw,u.salt);
  const nc=newRecoveryCode();u.rsalt=newSalt();u.rhash=await hashPw(nc.replace(/-/g,''),u.rsalt);
  saveUsers();LS.del(FAIL_KEY);return{ok:true,code:nc};
}
async function changeOwnPassword(cur,pw){
  const h=await hashPw(cur||'',me.salt);if(h!==me.hash)return{error:'The current password is incorrect.'};
  const pe=pwProblem(pw||'');if(pe)return{error:pe};
  me.salt=newSalt();me.hash=await hashPw(pw,me.salt);saveUsers();log('update','user',me.id,'Changed own password');save();return{ok:true};
}

const MODALS=[];
function modalHtml(o){
  return `<div class="modal ${o.size||''}" role="dialog" aria-modal="true" aria-label="${esc(o.title)}"><div class="modal-h"><h2>${esc(o.title)}</h2><button type="button" class="btn btn-icon" data-act="modal-close" aria-label="Close">${ic('x')}</button></div><div class="modal-b">${o.body()}</div>${o.foot?`<div class="modal-f">${o.foot()}</div>`:''}</div>`;
}
function openModal(o){
  const el=document.createElement('div');el.className='backdrop';el.innerHTML=modalHtml(o);
  $('#modals').appendChild(el);
  const m={el,o,prev:document.activeElement};MODALS.push(m);
  if(o.dismiss)el.addEventListener('mousedown',e=>{if(e.target===el)closeModal(m)});
  const first=$('input:not([type=hidden]):not([readonly]),select,textarea',el.querySelector('.modal-b'));
  (first||el.querySelector('.modal-h .btn')).focus({preventScroll:true});
  o.onMount&&o.onMount(el);
  return m;
}
function closeModal(m){
  m=m||MODALS[MODALS.length-1];if(!m)return;
  const i=MODALS.indexOf(m);if(i>=0)MODALS.splice(i,1);
  m.el.remove();m.o.onClose&&m.o.onClose();
  try{m.prev&&document.body.contains(m.prev)&&m.prev.focus({preventScroll:true})}catch(e){}
}
function closeAllModals(){while(MODALS.length)closeModal()}
function refreshModals(){
  MODALS.slice().forEach(m=>{
    if(!m.o.live)return;
    if(m.o.exists&&!m.o.exists()){closeModal(m);return}
    const sc=m.el.scrollTop;
    try{m.el.innerHTML=modalHtml(m.o);m.el.scrollTop=sc;m.o.onMount&&m.o.onMount(m.el)}catch(e){closeModal(m)}
  });
}
/* confirmation dialog: resolves false, true, or the reason text when a field is asked for */
function ask(o){
  return new Promise(res=>{
    let done=false;const fin=v=>{if(done)return;done=true;res(v)};
    const m=openModal({title:o.title,size:'sm',
      body:()=>`<div class="stack"><p style="margin:0">${o.message||''}</p>${o.field?`<div class="field"><label for="ask-field">${esc(o.field.label)}</label><${o.field.line?'input':'textarea'} id="ask-field" ${o.field.line?'type="text"':''} placeholder="${esc(o.field.placeholder||'')}"></${o.field.line?'input':'textarea'}><div class="hint" id="ask-hint" style="color:var(--bad-fg)"></div></div>`:''}</div>`,
      foot:()=>`<button type="button" class="btn" data-act="ask-no">${esc(o.cancel||'Cancel')}</button><button type="button" class="btn ${o.danger?'btn-danger':'btn-primary'}" data-act="ask-yes">${esc(o.confirm||'Confirm')}</button>`,
      onClose:()=>fin(false)});
    m.el._ask={fin,o,m};
  });
}

function paginate(rows,st){const size=st.size||10;const pages=Math.max(1,Math.ceil(rows.length/size));if(st.page>pages)st.page=pages;if(st.page<1)st.page=1;return{slice:rows.slice((st.page-1)*size,st.page*size),total:rows.length,pages}}
function sortRows(rows,st,g){const f=g[st.sort.k];if(!f)return rows;const d=st.sort.d;return rows.slice().sort((a,b)=>{const x=f(a),y=f(b);return(typeof x==='string'?x.localeCompare(y,undefined,{numeric:true,sensitivity:'base'}):cmp(x,y))*d})}
function th(view,st,key,label,cls,skey){const s=skey?st[skey]:st.sort;const on=s.k===key;return `<th class="${cls||''}" aria-sort="${on?(s.d>0?'ascending':'descending'):'none'}"><button type="button" class="th-sort" data-act="sort" data-view="${view}" data-key="${key}" ${skey?`data-skey="${skey}"`:''}>${label}${on?ic(s.d>0?'chevU':'chevD',14):''}</button></th>`}
function pagerHtml(view,st,pg,pkey){
  pkey=pkey||'page';const cur=st[pkey],size=st.size||10;
  if(pg.total===0)return '';
  const a=(cur-1)*size+1,b=Math.min(cur*size,pg.total);
  let nums=[];const add=n=>{if(nums.indexOf(n)<0&&n>=1&&n<=pg.pages)nums.push(n)};add(1);add(cur-1);add(cur);add(cur+1);add(pg.pages);nums.sort((x,y)=>x-y);
  let btns='',prev=0;nums.forEach(n=>{if(prev&&n-prev>1)btns+='<span aria-hidden="true">...</span>';btns+=`<button type="button" class="pg-btn" data-act="page" data-view="${view}" data-n="${n}" data-pkey="${pkey}" ${n===cur?'aria-current="true"':''} aria-label="Page ${n}">${n}</button>`;prev=n});

async function saveFile(name,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||'text/plain'});
  try{
    if(window.claude&&window.claude.use){const d=await window.claude.use('downloads');if(d){try{await d.save({filename:name,data:blob});toast('Saved '+name,'ok')}catch(e){if(!e||e.code!=='declined')toast('The file could not be saved here. Open the standalone copy to download.','err')}return}}
  }catch(e){}
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(url)},1500);toast('Downloaded '+name,'ok');
}
function csvText(headers,rows){
  const q=v=>{v=v==null?'':String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return '﻿'+[headers].concat(rows).map(r=>r.map(q).join(',')).join('\r\n');
}

function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function axisFmt(v){const a=Math.abs(v),s=v<0?'-':'';if(a>=1e6)return s+(a/1e6).toFixed(a%1e6?1:0).replace(/\.0$/,'')+'M';if(a>=1e3)return s+(a/1e3).toFixed(a%1e3?1:0).replace(/\.0$/,'')+'k';return s+String(a)}
const MONTH_LONG=['January','February','March','April','May','June','July','August','September','October','November','December'];

function barChart(labels,A,B,nameA,nameB){
  const W=560,H=260,L=58,R=548,T=16,Bm=222,max=niceMax(Math.max.apply(null,A.concat(B).concat([1]))),ticks=4;
  const y=v=>Bm-(v/max)*(Bm-T),gw=(R-L)/labels.length,bw=Math.min(26,gw/2-6);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(nameA+' and '+nameB+' by month: '+labels.map((l,i)=>l+' '+nameA+' '+mnum(A[i])+', '+nameB+' '+mnum(B[i])).join('; '))}">`;
  for(let k=0;k<=ticks;k++){const v=max/ticks*k;s+=`<line class="gl" x1="${L}" x2="${R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11">${axisFmt(v)}</text>`}
  labels.forEach((l,i)=>{const cx=L+gw*i+gw/2;
    s+=`<rect x="${cx-bw-2}" y="${y(A[i])}" width="${bw}" height="${Math.max(0,Bm-y(A[i]))}" rx="4" fill="var(--income)"><title>${esc(l)}: ${esc(nameA)} ${money(A[i])}</title></rect>`;
    s+=`<rect x="${cx+2}" y="${y(B[i])}" width="${bw}" height="${Math.max(0,Bm-y(B[i]))}" rx="4" fill="var(--expense)"><title>${esc(l)}: ${esc(nameB)} ${money(B[i])}</title></rect>`;
    s+=`<text x="${cx}" y="${Bm+22}" text-anchor="middle" font-size="12">${esc(l)}</text>`});
  return s+'</svg>';
}
function lineChart(labels,V,name){
  const W=560,H=260,L=58,R=540,T=22,Bm=222;
  let lo=Math.min.apply(null,V.concat([0])),hi=Math.max.apply(null,V.concat([0]));
  if(hi===lo)hi=lo+1;
  const step=niceMax((hi-lo)/3);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const y=v=>Bm-((v-lo)/(hi-lo))*(Bm-T),n=V.length,x=i=>n===1?(L+R)/2:L+(R-L)*i/(n-1);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(name+': '+labels.map((l,i)=>l+' '+mnum(V[i])).join('; '))}">`;
  const tk=Math.max(1,Math.round((hi-lo)/step));for(let k=0;k<=tk;k++){const v=lo+(hi-lo)/tk*k;s+=`<line class="gl" x1="${L}" x2="${R+8}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="11">${axisFmt(Math.round(v))}</text>`}
  if(lo<0)s+=`<line x1="${L}" x2="${R+8}" y1="${y(0)}" y2="${y(0)}" stroke="var(--fg-3)" stroke-dasharray="4 4"/>`;
  const pts=V.map((v,i)=>x(i)+','+y(v)).join(' ');
  s+=`<path d="M${x(0)},${y(0)} ${V.map((v,i)=>'L'+x(i)+','+y(v)).join(' ')} L${x(n-1)},${y(0)} Z" fill="var(--income)" fill-opacity=".1"/>`;
  s+=`<polyline points="${pts}" fill="none" stroke="var(--income)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  V.forEach((v,i)=>{const last=i===n-1;s+=`<circle cx="${x(i)}" cy="${y(v)}" r="${last?6:4.5}" fill="${last?'var(--income)':'var(--surface)'}" stroke="var(--income)" stroke-width="3"><title>${esc(labels[i])}: ${money(v)}</title></circle>`;
    if(last)s+=`<text class="strong" x="${Math.min(x(i),W-40)}" y="${y(v)-12}" text-anchor="middle" font-size="12">${axisFmt(Math.round(v))}</text>`;
    s+=`<text x="${x(i)}" y="${Bm+22}" text-anchor="middle" font-size="12">${esc(labels[i])}</text>`});
  return s+'</svg>';
}
function donutChart(parts,total,label){
  const C=2*Math.PI*70;let off=0,s=`<svg viewBox="0 0 200 200" role="img" aria-label="${esc(label+': '+parts.map(p=>p.l+' '+p.n).join(', '))}" style="width:168px;height:168px;flex:0 0 168px"><circle cx="100" cy="100" r="70" fill="none" stroke="var(--line)" stroke-width="22"/>`;
  parts.forEach(p=>{const len=total?p.n/total*C:0;if(len>0)s+=`<circle cx="100" cy="100" r="70" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${Math.max(len-2,0.5)} ${C-len+2}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"><title>${esc(p.l)}: ${p.n}</title></circle>`;off+=len});
  return s+`<text x="100" y="102" text-anchor="middle" font-size="32" font-weight="800" fill="var(--fg)" style="font-family:var(--font)">${total}</text><text x="100" y="124" text-anchor="middle" font-size="13" fill="var(--fg-2)" style="font-family:var(--font)">${esc(label)}</text></svg>`;
}
function kpiHtml(label,val,sub,icon,tone,isMoney,dark){
  return `<div class="kpi ${dark?'dark':''}"><div class="kpi-top"><span>${esc(label)}</span><span class="chip ${tone}" ${dark?'style="background:var(--accent);color:#04251A"':''}>${ic(icon,18)}</span></div><div><div class="kpi-val">${isMoney?`<small>${esc(db.settings.currency)}</small>${mnum(val)}`:val}</div><div class="kpi-sub">${sub}</div></div></div>`;
}

const BILL_STATUSES=['Paid','Partially Paid','Unpaid','Overdue'];
function billsFiltered(){
  const st=VS.bills,q=st.q.trim().toLowerCase();
  const rows=db.bills.filter(b=>{
    const i=bi(b);
    if(q){const hay=[b.no,b.biller.name,b.biller.company,b.description,b.notes,b.items.map(x=>x.desc).join(' ')].join(' ').toLowerCase();if(hay.indexOf(q)<0)return false}
    if(st.status&&i.status!==st.status)return false;
    if(st.biller&&b.billerId!==st.biller)return false;
    if(st.from&&b.billDate<st.from)return false;
    if(st.to&&b.billDate>st.to)return false;
    if(st.min!==''&&i.total<num(st.min))return false;
    if(st.max!==''&&i.total>num(st.max))return false;
    return true;
  });
  return sortRows(rows,st,{no:b=>b.no,biller:b=>b.biller.name,billDate:b=>b.billDate,dueDate:b=>b.dueDate,total:b=>bi(b).total,paid:b=>bi(b).paid,bal:b=>bi(b).bal,status:b=>bi(b).status});
}

function readBillForm(f){
  const d=fd(f);

function recalcBillForm(f){
  const d=readBillForm(f);

}

function paymentsFiltered(){

    if(q&&[p.ref,p.txRef,p.notes,b?b.no:'',b?b.biller.name:''].join(' ').toLowerCase().indexOf(q)<0)return false;

    if(st.biller&&(!b||b.billerId!==st.biller))return false;if(st.method&&p.method!==st.method)return false;
    if(st.status==='voided'&&!p.voided)return false;if(st.status==='recorded'&&p.voided)return false;return true});

}

const MOVE_LABEL={purchase:'Purchase',usage:'Usage',adjustment:'Adjustment'};
function stockFiltered(){
  const st=VS.stock,q=st.q.trim().toLowerCase();
  const rows=db.stock.filter(i=>{
    if(q&&[i.name,i.sku,i.code,i.category,i.description].join(' ').toLowerCase().indexOf(q)<0)return false;
    if(st.category&&i.category!==st.category)return false;
    if(st.level&&stockState(i)!==st.level)return false;return true});
  return sortRows(rows,st,{name:i=>i.name,sku:i=>i.sku||i.code,category:i=>i.category,qty:i=>num(i.qty),min:i=>stockMin(i),cost:i=>num(i.cost),value:i=>stockValue(i),supplier:i=>{const b=billerOf(i.billerId);return b?b.name:''}});
}
function movesFiltered(){
  const st=VS.stock,q=st.mq?String(st.mq).trim().toLowerCase():'';
  const rows=db.moves.filter(m=>{const it=itemOf(m.itemId);
    if(q&&[it?it.name:'',m.ref,m.note,m.by].join(' ').toLowerCase().indexOf(q)<0)return false;
    if(st.mtype&&m.type!==st.mtype)return false;if(st.mitem&&m.itemId!==st.mitem)return false;
    if(st.mfrom&&m.date<st.mfrom)return false;if(st.mto&&m.date>st.mto)return false;return true});
  const ms=st.msort,d=ms.d,g={date:m=>m.date+m.at,item:m=>{const it=itemOf(m.itemId);return it?it.name:''},type:m=>m.type,qty:m=>m.qty,balance:m=>m.balance};
  return rows.slice().sort((a,b)=>{const x=g[ms.k](a),y=g[ms.k](b);return(typeof x==='string'?x.localeCompare(y,undefined,{numeric:true}):cmp(x,y))*d});
}

function cfRange(){
  const st=VS.cashflow,t=IX.today;
  if(st.preset==='month'){return[monthStart(t),t]}
  if(st.preset==='30'){return[addDays(t,-29),t]}
  if(st.preset==='year'){return[t.slice(0,4)+'-01-01',t]}
  if(st.preset==='all'){return['','']}
  return[st.from,st.to];
}
const TXN_PILL={income:'paid',expense:'muted',transfer:'',adjustment:'warn'};
const TXN_LABEL={income:'Income',expense:'Expense',transfer:'Transfer',adjustment:'Adjustment'};
function cfRows(L,from,to){
  const st=VS.cashflow,q=st.q.trim().toLowerCase();
  let rows=L.filter(r=>(!from||r.date>=from)&&(!to||r.date<=to));
  rows=rows.filter(r=>{
    if(st.type&&r.type!==st.type)return false;
    if(st.account&&r.account!==st.account&&r.toAccount!==st.account)return false;
    if(q&&[r.desc,r.cat,r.code,r.ref,r.notes,r.method].join(' ').toLowerCase().indexOf(q)>=0===false)return false;return true});
  return sortRows(rows,st,{date:r=>r.date+r.code,type:r=>r.type,cat:r=>r.cat||'',desc:r=>r.desc,account:r=>r.account,amt:r=>flow(r)||r.amt});
}

    <div id="list-cashflow" style="margin-top:16px">${this.list()}</div></div>`;
  },
  list(){
    const st=VS.cashflow,[from,to]=cfRange(),L=ledger(),rows=cfRows(L,from,to),pg=paginate(rows,st);
    if(!rows.length)return emptyHtml('cash','No transactions found','Add income or expenses here, or record a payment on a bill.',can('txn.write')?`<button type="button" class="btn btn-primary" data-act="new-txn">${ic('plus')}Add transaction</button>`:'');

const inRange=(d,f)=>(!f.from||d>=f.from)&&(!f.to||d<=f.to);
function billReport(title,forced){
  return f=>{
    const st=forced||f.status;
    const bills=db.bills.filter(b=>inRange(b.billDate,f)&&(!f.biller||b.billerId===f.biller)&&(!st||bi(b).status===st)).sort((a,b)=>cmp(a.billDate,b.billDate)||cmp(a.no,b.no));
    const cols=[{k:'no',l:'Bill no.'},{k:'billDate',l:'Bill date',t:'date'},{k:'dueDate',l:'Due date',t:'date'},{k:'biller',l:'Biller'},{k:'total',l:'Total',t:'money'},{k:'paid',l:'Paid',t:'money'},{k:'bal',l:'Balance',t:'money'}];
    if(forced==='Overdue')cols.push({k:'late',l:'Days overdue',t:'num'});else cols.push({k:'status',l:'Status',t:'status'});
    const rows=bills.map(b=>{const i=bi(b);return{no:b.no,billDate:b.billDate,dueDate:b.dueDate,biller:b.biller.name,total:i.total,paid:i.paid,bal:i.bal,status:i.status,late:i.daysOver}});
    return{title,cols,rows,totals:{total:r2(sum(rows,r=>r.total)),paid:r2(sum(rows,r=>r.paid)),bal:r2(sum(rows,r=>r.bal))},summary:rows.length+' bill'+(rows.length===1?'':'s')};
  };
}

  {id:'bills',label:'Bills report',desc:'Every bill with amounts and status.',fl:['date','biller','status'],build:billReport('Bills report')},
  {id:'paid',label:'Paid bills report',desc:'Bills with no balance left.',fl:['date','biller'],build:billReport('Paid bills report','Paid')},
  {id:'unpaid',label:'Unpaid bills report',desc:'Bills with no payment yet and not past due.',fl:['date','biller'],build:billReport('Unpaid bills report','Unpaid')},
  {id:'partial',label:'Partially paid bills report',desc:'Bills with some payment and a balance left.',fl:['date','biller'],build:billReport('Partially paid bills report','Partially Paid')},
  {id:'overdue',label:'Overdue bills report',desc:'Bills with a balance left after the due date.',fl:['date','biller'],build:billReport('Overdue bills report','Overdue')},
  {id:'statement',label:'Biller statement',desc:'Bills and payments for one biller with a running balance.',fl:['date','biller*'],build:f=>{
    const bl=billerOf(f.biller);if(!bl)return{title:'Biller statement',need:'Choose a biller to build the statement.',cols:[],rows:[],totals:{}};
    const ev=[];db.bills.filter(b=>b.billerId===bl.id).forEach(b=>{ev.push({date:b.billDate,type:'Bill',ref:b.no,desc:b.description||b.items.map(i=>i.desc).join(', '),debit:bi(b).total,credit:0});
      bi(b).payments.forEach(p=>ev.push({date:p.date,type:'Payment',ref:p.ref,desc:'Payment by '+p.method+(p.txRef?' ('+p.txRef+')':'')+' on '+b.no,debit:0,credit:p.amount}))});
    ev.sort((a,b)=>cmp(a.date,b.date)||(a.type==='Bill'?-1:1));
    let open=0;ev.forEach(e=>{if(f.from&&e.date<f.from)open+=e.debit-e.credit});open=r2(open);
    let run=open;const rows=[];if(f.from)rows.push({date:f.from,type:'Opening',ref:'',desc:'Balance brought forward',debit:null,credit:null,bal:open});
    ev.filter(e=>inRange(e.date,f)).forEach(e=>{run=r2(run+e.debit-e.credit);rows.push(Object.assign({bal:run},e))});
    return{title:'Statement: '+bl.name,cols:[{k:'date',l:'Date',t:'date'},{k:'type',l:'Type'},{k:'ref',l:'Reference'},{k:'desc',l:'Description'},{k:'debit',l:'Billed',t:'money'},{k:'credit',l:'Paid',t:'money'},{k:'bal',l:'Balance',t:'money'}],rows,
      totals:{debit:r2(sum(rows,r=>r.debit||0)),credit:r2(sum(rows,r=>r.credit||0)),bal:run},summary:'Closing balance '+money(run)};}},
  {id:'payments',label:'Payment history report',desc:'Recorded payments by date and biller.',fl:['date','biller'],build:f=>{
    const ps=db.payments.filter(p=>!p.voided&&inRange(p.date,f)&&(!f.biller||(billOf(p.billId)&&billOf(p.billId).billerId===f.biller))).sort((a,b)=>cmp(a.date,b.date)||cmp(a.ref,b.ref));
    const rows=ps.map(p=>{const b=billOf(p.billId);return{ref:p.ref,date:p.date,bill:b?b.no:'',biller:b?b.biller.name:'',method:p.method,tx:p.txRef,amount:p.amount}});
    return{title:'Payment history report',cols:[{k:'ref',l:'Reference'},{k:'date',l:'Date',t:'date'},{k:'bill',l:'Bill'},{k:'biller',l:'Biller'},{k:'method',l:'Method'},{k:'tx',l:'Transaction ref.'},{k:'amount',l:'Amount',t:'money'}],rows,totals:{amount:r2(sum(rows,r=>r.amount))},summary:rows.length+' payment'+(rows.length===1?'':'s')+' (reversed payments are left out)'};}},
  {id:'stockval',label:'Stock valuation report',desc:'Current quantity and value of every item.',fl:['category'],build:f=>{
    const rows=db.stock.filter(i=>!f.category||i.category===f.category).sort((a,b)=>a.category.localeCompare(b.category)||a.name.localeCompare(b.name)).map(i=>({name:i.name,code:i.sku||i.code,cat:i.category,unit:i.unit,qty:num(i.qty),cost:num(i.cost),value:stockValue(i),level:stockState(i)==='out'?'Out of stock':stockState(i)==='low'?'Low stock':'In stock'}));
    return{title:'Stock valuation report',cols:[{k:'name',l:'Item'},{k:'code',l:'Code'},{k:'cat',l:'Category'},{k:'unit',l:'Unit'},{k:'qty',l:'On hand',t:'num'},{k:'cost',l:'Unit cost',t:'money'},{k:'value',l:'Value',t:'money'},{k:'level',l:'Level'}],rows,totals:{value:r2(sum(rows,r=>r.value))},summary:'As of '+fdate(IX.today)};}},
  {id:'stockmove',label:'Stock movement report',desc:'Purchases, usage and adjustments.',fl:['date','category'],build:f=>{
    const ms=db.moves.filter(m=>{const it=itemOf(m.itemId);return inRange(m.date,f)&&(!f.category||(it&&it.category===f.category))}).sort((a,b)=>cmp(a.date,b.date)||cmp(a.at,b.at));
    const rows=ms.map(m=>{const it=itemOf(m.itemId);return{date:m.date,item:it?it.name:'Deleted item',type:MOVE_LABEL[m.type],chg:m.qty,unit:it?it.unit:'',value:r2(Math.abs(m.qty)*(m.unitCost!=null?m.unitCost:it?num(it.cost):0)),bal:m.balance,ref:m.ref||m.note}});
    const pur=r2(sum(rows.filter(r=>r.type==='Purchase'),r=>r.value)),use=r2(sum(rows.filter(r=>r.type==='Usage'),r=>r.value));
    return{title:'Stock movement report',cols:[{k:'date',l:'Date',t:'date'},{k:'item',l:'Item'},{k:'type',l:'Type'},{k:'chg',l:'Change',t:'num'},{k:'unit',l:'Unit'},{k:'value',l:'Value',t:'money'},{k:'bal',l:'Balance after',t:'num'},{k:'ref',l:'Reference or note'}],rows,totals:{},summary:'Purchases '+money(pur)+' · Usage '+money(use)+' (valued at unit cost)'};}},
  {id:'cashflow',label:'Cash flow report',desc:'Every cash and bank movement with opening and closing balances.',fl:['date'],build:f=>{
    const L=ledger(),cs=cashSummary(f.from||'',f.to||'',L);
    const rows=cs.rows.map(r=>({date:r.date,code:r.code,type:TXN_LABEL[r.type],cat:r.cat,desc:r.desc,acct:r.type==='transfer'?r.account+' to '+r.toAccount:r.account,in:flow(r)>0?flow(r):null,out:flow(r)<0?-flow(r):null}));
    return{title:'Cash flow report',cols:[{k:'date',l:'Date',t:'date'},{k:'code',l:'ID'},{k:'type',l:'Type'},{k:'cat',l:'Category'},{k:'desc',l:'Description'},{k:'acct',l:'Account'},{k:'in',l:'Cash in',t:'money'},{k:'out',l:'Cash out',t:'money'}],rows,totals:{in:cs.inflow,out:cs.outflow},summary:'Opening '+money(cs.open)+' · Net '+money(cs.net)+' · Closing '+money(cs.close)};}},
  {id:'incexp',label:'Income and expense report',desc:'Income and expenses grouped by category.',fl:['date','category'],build:f=>{
    const L=ledger().filter(r=>inRange(r.date,f)&&(r.type==='income'||r.type==='expense')&&(!f.category||r.cat===f.category)),m={};
    L.forEach(r=>{const k=r.type+'|'+(r.cat||'Uncategorised');m[k]=(m[k]||0)+r.amt});
    const rows=Object.keys(m).map(k=>{const[t,c]=k.split('|');return{type:t==='income'?'Income':'Expense',cat:c,amount:r2(m[k])}}).sort((a,b)=>a.type.localeCompare(b.type)||b.amount-a.amount);
    const inc=r2(sum(rows.filter(r=>r.type==='Income'),r=>r.amount)),exp=r2(sum(rows.filter(r=>r.type==='Expense'),r=>r.amount));
    return{title:'Income and expense report',cols:[{k:'type',l:'Type'},{k:'cat',l:'Category'},{k:'amount',l:'Amount',t:'money'}],rows,totals:{},summary:'Income '+money(inc)+' · Expenses '+money(exp)+' · Net '+money(r2(inc-exp))};}}
];
function reportFilters(){const s=VS.reports;return{from:s.from,to:s.to,biller:s.biller,status:s.status,category:s.category}}
function buildReport(id,f){const d=REPORTS.find(r=>r.id===id);const rep=d.build(f||reportFilters());rep.id=id;rep.filters=f||reportFilters();return rep}
function cellText(c,v){if(v==null||v==='')return '';if(c.t==='money')return mnum(v);if(c.t==='date')return fdate(v);if(c.t==='num')return qfmt(v);return String(v)}
function reportSub(rep){const f=rep.filters,bits=[];if(f.from||f.to)bits.push((f.from?fdate(f.from):'Start')+' to '+(f.to?fdate(f.to):fdate(IX.today)));if(f.biller&&rep.id!=='statement'&&billerOf(f.biller))bits.push(billerOf(f.biller).name);if(f.status&&rep.id==='bills')bits.push(f.status);if(f.category)bits.push(f.category);return bits.join(' · ')}

  render(el){

    if(!rep.rows.length)return head+emptyHtml('chart','Nothing to report','No records match these filters. Widen the dates or clear the filters.');
    const tot=rep.cols.some(c=>rep.totals[c.k]!=null);

      ${shown.map(r=>`<tr>${rep.cols.map(c=>`<td class="${c.t==='money'||c.t==='num'?'num':''}">${c.t==='status'?pill(r[c.k]):esc(cellText(c,r[c.k]))}</td>`).join('')}</tr>`).join('')}</tbody>
      ${tot?`<tfoot><tr>${rep.cols.map((c,i)=>`<td class="${c.t==='money'||c.t==='num'?'num':''}">${i===0?'Total':rep.totals[c.k]!=null?mnum(rep.totals[c.k]):''}</td>`).join('')}</tr></tfoot>`:''}</table></div>${rep.rows.length>shown.length?`<div class="note" style="margin-top:12px">${ic('info')}<span>Showing the first 500 of ${rep.rows.length} rows. The CSV and PDF include every row.</span></div>`:''}`;
  }

function exportReport(id,fmt,f){
  const rep=buildReport(id,f||reportFilters());if(rep.need){toast(rep.need,'err');return}
  if(!rep.rows.length){toast('There is nothing to export with these filters.','err');return}
  const name=rep.title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')+'-'+fileStamp();
  if(fmt==='csv'){
    const cols=rep.cols,rows=rep.rows.map(r=>cols.map(c=>r[c.k]==null?'':r[c.k]));
    if(cols.some(c=>rep.totals[c.k]!=null))rows.push(cols.map((c,i)=>i===0?'Total':rep.totals[c.k]!=null?rep.totals[c.k]:''));
    saveFile(name+'.csv',csvText(cols.map(c=>c.l),rows),'text/csv');
  }else reportPdf(rep,name);
}
ACT['rep-csv']=()=>exportReport(VS.reports.type,'csv');

FORM.settings=f=>{
  if(!isAdmin()){toast('Only administrators can change settings.','err');return}
  const d=fd(f),s=db.settings,t=f.dataset.tab;
  if(t==='business'){if(!String(d.name||'').trim()){formErr(f,'Enter the business name.');return}
    Object.assign(s.business,{name:d.name.trim(),phone:d.phone.trim(),email:d.email.trim(),taxId:d.taxId.trim(),address:d.address.trim()})}
  else if(t==='billing'){
    if(!/^[A-Za-z0-9]{1,8}$/.test(d.billPrefix||'')||!/^[A-Za-z0-9]{1,8}$/.test(d.payPrefix||'')){formErr(f,'Prefixes must be 1 to 8 letters or numbers.');return}
    const bn=parseInt(d.billNext,10),pn=parseInt(d.payNext,10);if(!(bn>=1)||!(pn>=1)){formErr(f,'Next numbers must be 1 or higher.');return}

  else if(t==='regional'){Object.assign(s,{currency:d.currency,dateFormat:d.dateFormat,timezone:d.timezone,openingCash:r2(num(d.openingCash)),openingBank:r2(num(d.openingBank))});NF=null}

CHANGE.logo=el=>{
  const file=el.files&&el.files[0];if(!file)return;

    const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);
    db.settings.business.logo=c.toDataURL('image/png');db.settings.business.logoRatio=c.width/c.height;log('update','settings','logo','Updated the logo');save();toast('Logo updated.','ok');refresh()};
    img.onerror=()=>toast('That file could not be read as an image.','err');img.src=rd.result};rd.readAsDataURL(file);
};
