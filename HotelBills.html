FORM.addcat=f=>{const n=String(fd(f).name||'').trim(),k=f.dataset.kind;if(!n)return;if(db.categories[k].some(c=>c.toLowerCase()===n.toLowerCase())){toast('That category already exists.','err');return}db.categories[k].push(n);log('create','settings','cat','Added '+k+' category '+n);save();refresh()};
ACT['del-cat']=async el=>{const k=el.dataset.kind,n=el.dataset.name;
  const used=k==='stock'?db.stock.some(i=>i.category===n):db.txns.some(t=>t.category===n);
  if(used){toast('"'+n+'" is used by existing records, so it cannot be removed.','err');return}
  if(db.categories[k].length<=1){toast('Keep at least one category in this list.','err');return}
  db.categories[k]=db.categories[k].filter(c=>c!==n);save();refresh()};

/* ---- users ---- */
function usersHtml(){
  return `<div class="stack"><div class="row" style="justify-content:space-between"><p style="margin:0;color:var(--fg-2)">Administrators can change everything. Staff can record bills, payments, stock and transactions but cannot delete records, reverse payments or change settings.</p><button type="button" class="btn btn-primary" data-act="new-user">${ic('plus')}Add user</button></div>
  <div class="tbl-wrap"><table class="tbl" style="min-width:640px"><thead><tr><th>Name</th><th>Email or username</th><th>Role</th><th>Status</th><th class="act"><span class="sr">Actions</span></th></tr></thead><tbody>${users.map(u=>`<tr><td><b>${esc(u.name)}</b>${u.id===me.id?' <span class="pill muted">You</span>':''}</td><td>${esc(u.email)}</td><td>${u.role==='admin'?'Administrator':'Staff'}</td><td><span class="pill ${u.active?'active':'inactive'}">${u.active?'Active':'Deactivated'}</span></td><td class="act">${ib('edit-user','edit','Edit '+u.name,`data-id="${u.id}"`)}${ib('reset-user','lock','Set a new password for '+u.name,`data-id="${u.id}"`)}</td></tr>`).join('')}</tbody></table></div></div>`;
}
const adminCount=()=>users.filter(u=>u.role==='admin'&&u.active).length;
function openUserForm(id){
  const u=id?users.find(x=>x.id===id):{name:'',email:'',role:'staff',active:true};
  openModal({title:id?'Edit user':'Add user',size:'sm',body:()=>`<form id="user-form" data-form="user" data-id="${id||''}" novalidate>${errBox()}<div class="stack">
    ${F('Full name','name',u.name,{req:1})}${id?`<div class="field"><span class="lbl">Email or username</span><div style="font-weight:600">${esc(u.email)}</div></div>`:F('Email or username','email','',{req:1,attrs:'autocomplete="off"'})}
    ${F('Role','role',u.role,{type:'select',options:[{v:'admin',l:'Administrator'},{v:'staff',l:'Staff'}]})}
    ${id?F('Status','active',u.active?'1':'0',{type:'select',options:[{v:'1',l:'Active'},{v:'0',l:'Deactivated (cannot sign in)'}]}):`<div class="field"><label for="u-pw">Temporary password <span class="req" aria-hidden="true">*</span></label><div class="pw"><input id="u-pw" name="password" type="password" autocomplete="new-password"></div><div class="hint">At least 8 characters with a letter and a number. The user can change it in User Profile.</div></div>`}</div></form>`,
    foot:()=>`<button type="button" class="btn" data-act="modal-close">Cancel</button><button type="submit" form="user-form" class="btn btn-primary">${ic('check')}Save</button>`});
}
FORM.user=async f=>{
  if(!isAdmin())return;const id=f.dataset.id||null,d=fd(f);
  if(id){const u=users.find(x=>x.id===id);const act=d.active==='1';
    if((u.role==='admin'&&(d.role!=='admin'||!act))&&adminCount()<=1&&u.active){formErr(f,'Keep at least one active administrator.');return}
    if(u.id===me.id&&!act){formErr(f,'You cannot deactivate your own account.');return}
    if(!String(d.name||'').trim()){formErr(f,'Enter a name.');return}
    u.name=d.name.trim();u.role=d.role;u.active=act;saveUsers();log('update','user',u.id,'Updated user '+u.name);save();closeModal();toast('User updated.','ok');refresh();return}
  const r=await withBusy('Creating account',()=>createUser({name:d.name,email:d.email,role:d.role,password:d.password}));
  if(r.error){formErr(f,r.error);return}
  log('create','user',r.user.id,'Added '+(r.user.role==='admin'?'administrator ':'staff user ')+r.user.name);save();closeModal();refresh();showRecovery(r.user.name,r.code);
};
ACT['new-user']=()=>openUserForm();
ACT['edit-user']=el=>openUserForm(el.dataset.id);
ACT['reset-user']=el=>{const u=users.find(x=>x.id===el.dataset.id);if(!u)return;
  openModal({title:'New password for '+u.name,size:'sm',body:()=>`<form id="reset-form" data-form="resetuser" data-id="${u.id}" novalidate>${errBox()}<div class="field"><label for="r-pw">New password</label><div class="pw"><input id="r-pw" name="password" type="password" autocomplete="new-password"></div><div class="hint">Share it with ${esc(u.name)} securely. They can change it in User Profile.</div></div></form>`,
    foot:()=>`<button type="button" class="btn" data-act="modal-close">Cancel</button><button type="submit" form="reset-form" class="btn btn-primary">Set password</button>`})};
FORM.resetuser=async f=>{const u=users.find(x=>x.id===f.dataset.id),pw=fd(f).password||'',pe=pwProblem(pw);if(pe){formErr(f,pe);return}
  await withBusy('Saving',async()=>{u.salt=newSalt();u.hash=await hashPw(pw,u.salt);saveUsers()});log('update','user',u.id,'Reset password for '+u.name);save();closeModal();toast('Password updated for '+u.name+'.','ok')};
function showRecovery(name,code){
  openModal({title:'Save the recovery code',size:'sm',body:()=>`<div class="stack"><p style="margin:0">This code lets <b>${esc(name)}</b> reset a forgotten password. It is shown only once, so write it down and keep it somewhere safe.</p><div class="code-box">${esc(code)}</div><button type="button" class="btn" data-act="copy-code" data-code="${esc(code)}">${ic('copy')}Copy code</button></div>`,
    foot:()=>`<button type="button" class="btn btn-primary" data-act="modal-close">I have saved it</button>`})}
ACT['copy-code']=async el=>{try{await navigator.clipboard.writeText(el.dataset.code);toast('Code copied.','ok')}catch(e){const b=$('.code-box');if(b){const r=document.createRange();r.selectNodeContents(b);const s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Select the code and copy it.','')}};

/* ---- data + audit ---- */
function dataHtml(){
  const rows=db.audit.filter(a=>!SET.auditQ||(a.summary+' '+a.user+' '+a.entity+' '+a.action).toLowerCase().indexOf(SET.auditQ.toLowerCase())>=0).slice(0,100);
  return `<div class="stack" style="gap:22px"><div class="grid w3">
    <div class="card" style="box-shadow:none"><h3>Backup</h3><p style="color:var(--fg-2)">Download all bills, billers, payments, stock, settings and user accounts as one file. Accounts are stored with hashed passwords, so keep the file private.${db.settings.lastBackup?'<br>Last backup: '+fdatetime(db.settings.lastBackup)+'.':'<br><b>No backup yet.</b>'}</p><button type="button" class="btn btn-primary" data-act="backup">${ic('dl')}Download backup</button></div>
    <div class="card" style="box-shadow:none"><h3>Restore</h3><p style="color:var(--fg-2)">Replace everything in this workspace with the contents of a backup file.</p><label class="btn" for="restore-file" style="cursor:pointer">${ic('upload')}Choose backup file</label><input id="restore-file" type="file" accept="application/json,.json" class="sr" data-ch="restore"></div>
    <div class="card" style="box-shadow:none"><h3>Start over</h3><p style="color:var(--fg-2)">Erase every record and start fresh. Download a backup first.</p><button type="button" class="btn btn-danger" data-act="erase-all">${ic('trash')}Erase all data</button></div></div>
  <div class="note">${ic('info')}<span>Your data is stored in this browser on this device. Download a backup weekly, and before clearing browser data or switching devices. <b id="persist-state"></b></span></div>
  <div><div class="card-h"><div><h3>Audit log</h3><p>Who changed what, newest first (latest 100 shown)</p></div><div class="field" style="min-width:240px"><label class="sr" for="audit-q">Filter the audit log</label><input id="audit-q" type="search" placeholder="Filter" value="${esc(SET.auditQ)}" data-in="auditq"></div></div>
  <div id="audit-list">${auditTable(rows)}</div></div></div>`;
}
function auditTable(rows){return rows.length?`<div class="tbl-wrap"><table class="tbl" style="min-width:640px"><thead><tr><th>When</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody>${rows.map(a=>`<tr><td style="white-space:nowrap">${fdatetime(a.at)}</td><td>${esc(a.user)}</td><td><span class="pill muted">${esc(a.entity)} · ${esc(a.action)}</span></td><td>${esc(a.summary)}</td></tr>`).join('')}</tbody></table></div>`:emptyHtml('history','No activity found','Changes you make will be listed here.')}
INPUT.auditq=el=>{SET.auditQ=el.value;const rows=db.audit.filter(a=>!SET.auditQ||(a.summary+' '+a.user+' '+a.entity+' '+a.action).toLowerCase().indexOf(SET.auditQ.toLowerCase())>=0).slice(0,100);$('#audit-list').innerHTML=auditTable(rows)};
ACT.backup=()=>{db.settings.lastBackup=nowISO();save();const payload=JSON.stringify({app:'HotelBills',version:1,exportedAt:nowISO(),data:db,users:users},null,1);saveFile('hotelbills-backup-'+fileStamp()+'.json',payload,'application/json');refresh()};
CHANGE.restore=el=>{
  const file=el.files&&el.files[0];if(!file)return;el.value='';
  const rd=new FileReader();rd.onload=async()=>{
    let p;try{p=JSON.parse(rd.result)}catch(e){toast('That file is not a valid backup.','err');return}
    const d=p&&p.data;if(!d||!Array.isArray(d.bills)||!Array.isArray(d.billers)||!Array.isArray(d.payments)||!d.settings){toast('That file is not a HotelBills backup.','err');return}
    const ok=await ask({title:'Restore this backup?',message:`The backup has <b>${d.bills.length}</b> bills, <b>${d.billers.length}</b> billers and <b>${d.payments.length}</b> payments. Everything currently in this workspace will be replaced. Download a backup of the current data first if you may need it.`,confirm:'Replace my data',danger:true});
    if(!ok)return;
    db=Object.assign(blankDb(),d);db.settings=Object.assign(defaultSettings(),d.settings);db.settings.business=Object.assign(defaultSettings().business,d.settings.business||{});NF=null;
    log('restore','data','all','Restored a backup with '+d.bills.length+' bills');reindex();save();toast('Backup restored.','ok');refresh();
  };rd.readAsText(file);
};
ACT['erase-all']=async()=>{
  if(!isAdmin())return;
  const v=await ask({title:'Erase all data?',message:'This permanently deletes every bill, biller, payment, stock item and transaction, and resets settings. User accounts are kept. Download a backup first if you may need this data. Type <b>ERASE</b> to confirm.',confirm:'Erase everything',danger:true,field:{label:'Confirmation',required:true,line:true,placeholder:'ERASE'}});
  if(!v)return;if(String(v).trim().toUpperCase()!=='ERASE'){toast('Nothing was erased. Type ERASE to confirm.','err');return}
  const keep=db.settings.business;db=blankDb();db.settings.business=Object.assign(db.settings.business,{name:keep.name});NF=null;log('erase','data','all','Erased all data');reindex();save();toast('All data erased.','ok');go('dashboard');
};

/* ---- profile ---- */

  <div class="card"><div class="card-h"><h3>Change password</h3></div><form id="pw-form" data-form="mypw" novalidate>${errBox()}<div class="stack">
    <div class="field"><label for="pw-cur">Current password</label><div class="pw"><input id="pw-cur" name="cur" type="password" autocomplete="current-password"></div></div>
    <div class="field"><label for="pw-new">New password</label><div class="pw"><input id="pw-new" name="pw" type="password" autocomplete="new-password"></div><div class="hint">At least 8 characters with a letter and a number.</div></div>

FORM.profile=f=>{const n=String(fd(f).name||'').trim();if(!n){formErr(f,'Enter your name.');return}me.name=n;saveUsers();log('update','user',me.id,'Updated own profile');save();toast('Profile saved.','ok');refresh()};
FORM.mypw=async f=>{const d=fd(f);if(d.pw!==d.pw2){formErr(f,'The new passwords do not match.');return}
  const r=await withBusy('Updating password',()=>changeOwnPassword(d.cur,d.pw));if(r.error){formErr(f,r.error);return}f.reset();toast('Password updated.','ok')};
ACT['new-recovery']=()=>{
  openModal({title:'New recovery code',size:'sm',body:()=>`<form id="rc-form" data-form="newrc" novalidate>${errBox()}<p style="margin:0 0 12px">Confirm your password to create a new recovery code. The old code stops working.</p><div class="field"><label for="rc-pw">Current password</label><div class="pw"><input id="rc-pw" name="pw" type="password" autocomplete="current-password"></div></div></form>`,
    foot:()=>`<button type="button" class="btn" data-act="modal-close">Cancel</button><button type="submit" form="rc-form" class="btn btn-primary">Create code</button>`})};
FORM.newrc=async f=>{const pw=fd(f).pw||'';const r=await withBusy('Checking',async()=>{const h=await hashPw(pw,me.salt);if(h!==me.hash)return{error:'That password is not correct.'};const c=newRecoveryCode();me.rsalt=newSalt();me.rhash=await hashPw(c.replace(/-/g,''),me.rsalt);saveUsers();return{ok:true,code:c}});
  if(r.error){formErr(f,r.error);return}closeModal();showRecovery(me.name,r.code)};

/* ============================================================
   Documents: HTML preview / print + jsPDF generation
   All documents are built from the saved records, never from sample text.
   ============================================================ */
const STAMP={Paid:['#047857','Paid'],'Partially Paid':['#B45309','Partially paid'],Unpaid:['#B91C1C','Unpaid'],Overdue:['#991B1B','Overdue']};
const nl2br=s=>esc(s).replace(/\n/g,'<br>');
function docHeadHtml(title,sub,stampHtml){
  const b=db.settings.business;
  return `<div class="ph"><div>${b.logo?`<img src="${esc(b.logo)}" alt="">`:''}<div style="font-size:17px;font-weight:800;color:var(--paper-head)">${esc(b.name)}</div><div style="color:var(--paper-2)">${nl2br(b.address)}${b.address?'<br>':''}${esc([b.phone,b.email].filter(Boolean).join(' | '))}${b.taxId?'<br>Tax no. '+esc(b.taxId):''}</div></div>
  <div style="text-align:right"><h1>${esc(title)}</h1><div style="color:var(--paper-2);margin-top:4px">${esc(sub)}</div>${stampHtml||''}</div></div>`;
}
function docBillHtml(id){
  const b=billOf(id),i=bi(b),x=b.biller,s=db.settings,st=STAMP[i.status];
  const ps=i.payments.slice().sort((a,c)=>cmp(a.date,c.date));
  return `<div class="paper">${docHeadHtml('BILL',b.no,`<div style="margin-top:8px"><span class="stamp" style="color:${st[0]}">${st[1]}</span></div>`)}
  <div class="two"><div><h4>Biller</h4><b>${esc(x.name)}</b>${x.company?'<br>'+esc(x.company):''}${x.contact?'<br>Attn: '+esc(x.contact):''}${x.phone?'<br>'+esc(x.phone):''}${x.email?'<br>'+esc(x.email):''}${x.address?'<br>'+nl2br(x.address):''}${x.taxId?'<br>Tax no. '+esc(x.taxId):''}</div>
  <div style="text-align:right"><h4>Details</h4>Bill date: <b>${fdate(b.billDate)}</b><br>Due date: <b>${fdate(b.dueDate)}</b>${b.method?'<br>Payment method: '+esc(b.method):''}${b.description?'<br>Reference: '+esc(b.description):''}</div></div>
  <table><thead><tr><th style="width:30px">#</th><th>Description</th><th class="r">Qty</th><th class="r">Unit price</th><th class="r">Amount</th></tr></thead><tbody>${b.items.map((l,k)=>`<tr><td>${k+1}</td><td>${esc(l.desc)}</td><td class="r">${qfmt(l.qty)}</td><td class="r">${mnum(l.price)}</td><td class="r">${mnum(l.qty*l.price)}</td></tr>`).join('')}</tbody></table>
  <div class="tot"><div><span>Subtotal</span><span>${money(i.sub)}</span></div><div><span>Discount${b.discountType==='pct'?' ('+b.discount+'%)':''}</span><span>- ${money(i.dAmt)}</span></div><div><span>${esc(s.taxName)} (${b.taxPct}%)</span><span>${money(i.tax)}</span></div><div class="g"><span>Grand total</span><span>${money(i.total)}</span></div><div><span>Amount paid</span><span>${money(i.paid)}</span></div><div style="font-weight:800;color:${i.bal>0?'#B91C1C':'#047857'}"><span>Outstanding balance</span><span>${money(i.bal)}</span></div></div>
  ${ps.length?`<h4 style="margin-top:8px">Payment history</h4><table><thead><tr><th>Reference</th><th>Date</th><th>Method</th><th>Transaction ref.</th><th class="r">Amount</th></tr></thead><tbody>${ps.map(p=>`<tr><td>${esc(p.ref)}</td><td>${fdate(p.date)}</td><td>${esc(p.method)}</td><td>${esc(p.txRef||'-')}</td><td class="r">${mnum(p.amount)}</td></tr>`).join('')}</tbody></table>`:''}
  ${b.notes?`<h4>Notes</h4><div>${nl2br(b.notes)}</div>`:''}${s.terms?`<h4 style="margin-top:12px">Terms</h4><div style="color:var(--paper-2)">${nl2br(s.terms)}</div>`:''}
  <div class="foot">Generated ${fdatetime(nowISO())} from saved records. Bill created by ${esc(b.createdBy)}.</div></div>`;
}
function docReceiptHtml(id){
  const p=db.payments.find(x=>x.id===id),b=billOf(p.billId),i=b?bi(b):null;
  return `<div class="paper">${docHeadHtml('PAYMENT RECEIPT',p.ref,p.voided?`<div style="margin-top:8px"><span class="stamp" style="color:#991B1B">Voided</span></div>`:'')}
  <div class="two"><div><h4>Paid to</h4><b>${esc(b?b.biller.name:'-')}</b>${b&&b.biller.company?'<br>'+esc(b.biller.company):''}</div><div style="text-align:right"><h4>Payment date</h4><b>${fdate(p.date)}</b></div></div>
  <div style="border:2px solid var(--paper-head);border-radius:8px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><span style="font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--paper-2)">Amount paid</span><span style="font-size:26px;font-weight:800;color:var(--paper-head)">${money(p.amount)}</span></div>
  <table><tbody><tr><td style="width:40%;color:var(--paper-2)">Bill number</td><td>${esc(b?b.no:'-')}</td></tr><tr><td style="color:var(--paper-2)">Payment method</td><td>${esc(p.method)}</td></tr><tr><td style="color:var(--paper-2)">Transaction reference</td><td>${esc(p.txRef||'-')}</td></tr><tr><td style="color:var(--paper-2)">Paid by</td><td>${esc(p.by||'-')}</td></tr>${p.notes?`<tr><td style="color:var(--paper-2)">Notes</td><td>${esc(p.notes)}</td></tr>`:''}</tbody></table>
  ${i?`<div class="tot"><div><span>Bill total</span><span>${money(i.total)}</span></div><div><span>Paid to date</span><span>${money(i.paid)}</span></div><div class="g"><span>Balance remaining</span><span>${money(i.bal)}</span></div></div>`:''}
  <div style="display:flex;justify-content:space-between;gap:40px;margin-top:48px"><div style="flex:1;border-top:1px solid var(--paper-fg);padding-top:6px;color:var(--paper-2)">Authorised signature</div><div style="flex:1;border-top:1px solid var(--paper-fg);padding-top:6px;color:var(--paper-2)">Received by</div></div>
  <div class="foot">Generated ${fdatetime(nowISO())} from saved records.</div></div>`;
}
function docHtml(kind,id){return kind==='bill'?docBillHtml(id):docReceiptHtml(id)}
ACT['doc-preview']=el=>{
  const kind=el.dataset.kind,id=el.dataset.id;
  openModal({title:kind==='bill'?'Bill preview':'Receipt preview',size:'lg',body:()=>`<div class="paper-wrap">${docHtml(kind,id)}</div>`,
    foot:()=>`<button type="button" class="btn" data-act="modal-close">Close</button><button type="button" class="btn" data-act="doc-print" data-kind="${kind}" data-id="${id}">${ic('print')}Print</button><button type="button" class="btn btn-primary" data-act="${kind==='bill'?'bill-pdf':'receipt-pdf'}" data-id="${id}">${ic('pdf')}Download PDF</button>`});
};
ACT['doc-print']=el=>{
  const pa=$('#printArea');pa.innerHTML=docHtml(el.dataset.kind,el.dataset.id);pa.setAttribute('aria-hidden','false');
  const done=()=>{pa.innerHTML='';pa.setAttribute('aria-hidden','true')};
  window.addEventListener('afterprint',done,{once:true});
  try{window.print()}catch(e){done();toast('Printing is not available here. Download the PDF instead.','err');return}
  if(window.self!==window.top)setTimeout(()=>{if(pa.innerHTML)toast('If no print window opened, download the PDF and print it from there.','')},900);
};
ACT['bill-pdf']=el=>billPdf(el.dataset.id);
ACT['receipt-pdf']=el=>receiptPdf(el.dataset.id);

/* ---------- jsPDF ---------- */
const NAVY=[11,31,68],GREYT=[75,85,99];
const S=s=>String(s==null?'':s).replace(/[^\x20-\x7E -ÿ]/g,'?');
function newPdf(o){const J=window.jspdf&&window.jspdf.jsPDF;if(!J){toast('The PDF tool did not load. Check your internet connection and try again.','err');return null}return new J(o||{unit:'mm',format:'a4'})}
function table(doc,o){if(typeof doc.autoTable==='function')doc.autoTable(o);else if(window.jspdf&&window.jspdf.autoTable)window.jspdf.autoTable(doc,o);else throw new Error('The PDF table tool did not load.')}
const endY=doc=>(doc.lastAutoTable&&doc.lastAutoTable.finalY)||0;
function pdfHead(doc,title,sub,stamp){
  const biz=db.settings.business,W=doc.internal.pageSize.getWidth(),M=15;let y=M;
  if(biz.logo){const r=biz.logoRatio||1;let h=16,w=h*r;if(w>42){w=42;h=w/r}try{doc.addImage(biz.logo,'PNG',M,y,w,h)}catch(e){}y+=h+3}
  doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);doc.text(S(biz.name),M,y+4);
  doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(GREYT[0],GREYT[1],GREYT[2]);
  let ly=y+9;[].concat(doc.splitTextToSize(S(biz.address),90),[S([biz.phone,biz.email].filter(Boolean).join('  |  '))],biz.taxId?['Tax no. '+S(biz.taxId)]:[]).filter(Boolean).forEach(l=>{doc.text(l,M,ly);ly+=4.2});
  doc.setFont('helvetica','bold');doc.setFontSize(21);doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);doc.text(S(title),W-M,M+8,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.setTextColor(GREYT[0],GREYT[1],GREYT[2]);doc.text(S(sub),W-M,M+14.5,{align:'right'});
  if(stamp){doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(stamp.c[0],stamp.c[1],stamp.c[2]);doc.text(S(stamp.t).toUpperCase(),W-M,M+21,{align:'right'})}
  y=Math.max(ly,M+25)+1;doc.setDrawColor(NAVY[0],NAVY[1],NAVY[2]);doc.setLineWidth(.8);doc.line(M,y,W-M,y);return y+7;
}
function pdfFooters(doc,label){
  const n=doc.getNumberOfPages(),W=doc.internal.pageSize.getWidth(),H=doc.internal.pageSize.getHeight();
  for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120,128,140);
    doc.text(S(label+' | Generated '+fdatetime(nowISO())),15,H-8);doc.text('Page '+i+' of '+n,W-15,H-8,{align:'right'})}
}
function pdfLines(doc,x,y,lines,o){o=o||{};doc.setFont('helvetica',o.bold?'bold':'normal');doc.setFontSize(o.size||9.5);doc.setTextColor.apply(doc,o.color||[17,24,39]);lines.forEach(l=>{doc.text(S(l),x,y,o.align?{align:o.align}:undefined);y+=o.gap||4.6});return y}
function pdfTotals(doc,y,rows){
  const W=doc.internal.pageSize.getWidth(),x0=W-15-78,x1=W-15;
  rows.forEach(r=>{if(y>270){doc.addPage();y=20}
    if(r.rule){doc.setDrawColor(NAVY[0],NAVY[1],NAVY[2]);doc.setLineWidth(.5);doc.line(x0,y-4.2,x1,y-4.2)}
    doc.setFont('helvetica',r.bold?'bold':'normal');doc.setFontSize(r.big?11.5:9.5);doc.setTextColor.apply(doc,r.color||[17,24,39]);
    doc.text(S(r.l),x0,y);doc.text(S(r.v),x1,y,{align:'right'});y+=r.big?7:5.4});
  return y;
}
const TBL={theme:'striped',styles:{fontSize:9,cellPadding:2.2,textColor:[17,24,39],lineColor:[209,213,219]},headStyles:{fillColor:NAVY,textColor:255,fontStyle:'bold',fontSize:8.5},alternateRowStyles:{fillColor:[248,250,252]},margin:{left:15,right:15}};
async function billPdf(id){
  const b=billOf(id);if(!b)return;const doc=newPdf();if(!doc)return;
  let blob;
  try{blob=await withBusy('Preparing PDF',()=>{
    const i=bi(b),x=b.biller,s=db.settings,st=STAMP[i.status],W=210,M=15;
    const c=st[0].replace('#','');const col=[parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)];
    let y=pdfHead(doc,'BILL',b.no,{t:st[1],c:col});
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(GREYT[0],GREYT[1],GREYT[2]);doc.text('BILLER',M,y);doc.text('DETAILS',W-M-60,y);
    let y1=pdfLines(doc,M,y+5,[x.name].concat(x.company?[x.company]:[],x.contact?['Attn: '+x.contact]:[],x.phone?[x.phone]:[],x.email?[x.email]:[],doc.splitTextToSize(S(x.address||''),85).filter(Boolean),x.taxId?['Tax no. '+x.taxId]:[]),{});
    let y2=pdfLines(doc,W-M-60,y+5,['Bill date: '+fdate(b.billDate),'Due date: '+fdate(b.dueDate)].concat(b.method?['Method: '+b.method]:[],b.description?doc.splitTextToSize(S('Ref: '+b.description),60):[]),{});
    y=Math.max(y1,y2)+4;
    table(doc,Object.assign({},TBL,{startY:y,head:[['#','Description','Qty','Unit price','Amount']],body:b.items.map((l,k)=>[k+1,S(l.desc),qfmt(l.qty),mnum(l.price),mnum(l.qty*l.price)]),columnStyles:{0:{cellWidth:10},2:{halign:'right',cellWidth:20},3:{halign:'right',cellWidth:32},4:{halign:'right',cellWidth:32}},headStyles:Object.assign({},TBL.headStyles)}));
    y=endY(doc)+8;if(y>235){doc.addPage();y=20}
    y=pdfTotals(doc,y,[{l:'Subtotal',v:money(i.sub)},{l:'Discount'+(b.discountType==='pct'?' ('+b.discount+'%)':''),v:'- '+money(i.dAmt)},{l:s.taxName+' ('+b.taxPct+'%)',v:money(i.tax)},{l:'Grand total',v:money(i.total),bold:true,big:true,rule:true},{l:'Amount paid',v:money(i.paid)},{l:'Outstanding balance',v:money(i.bal),bold:true,color:i.bal>0?[185,28,28]:[4,120,87]}]);
    const ps=i.payments.slice().sort((a,c2)=>cmp(a.date,c2.date));
    if(ps.length){y+=4;if(y>240){doc.addPage();y=20}doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);doc.text('Payment history',M,y);
      table(doc,Object.assign({},TBL,{startY:y+3,head:[['Reference','Date','Method','Transaction ref.','Amount']],body:ps.map(p=>[p.ref,fdate(p.date),S(p.method),S(p.txRef||'-'),mnum(p.amount)]),columnStyles:{4:{halign:'right'}}}));y=endY(doc)+7}
    if(b.notes||s.terms){if(y>245){doc.addPage();y=20}
      if(b.notes){doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);doc.text('Notes',M,y);y=pdfLines(doc,M,y+5,doc.splitTextToSize(S(b.notes),W-30),{size:9})+3}
      if(s.terms){doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);doc.text('Terms',M,y);pdfLines(doc,M,y+5,doc.splitTextToSize(S(s.terms),W-30),{size:8.5,color:GREYT})}}
    pdfFooters(doc,s.business.name+' | '+b.no);
    return doc.output('blob');
  })}catch(e){console.error(e);toast('The PDF could not be created: '+(e&&e.message||e),'err');return}
  await saveFile(b.no+'.pdf',blob,'application/pdf');
}
async function receiptPdf(id){
  const p=db.payments.find(x=>x.id===id);if(!p)return;const b=billOf(p.billId),i=b?bi(b):null;const doc=newPdf();if(!doc)return;let blob;
  try{blob=await withBusy('Preparing receipt',()=>{
    const W=210,M=15;let y=pdfHead(doc,'PAYMENT RECEIPT',p.ref,p.voided?{t:'Voided',c:[153,27,27]}:null);
    doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(GREYT[0],GREYT[1],GREYT[2]);doc.text('PAID TO',M,y);doc.text('PAYMENT DATE',W-M,y,{align:'right'});
    pdfLines(doc,M,y+5,[b?b.biller.name:'-'].concat(b&&b.biller.company?[b.biller.company]:[]),{bold:true,size:10.5});pdfLines(doc,W-M,y+5,[fdate(p.date)],{bold:true,size:10.5,align:'right'});
    y+=20;doc.setDrawColor(NAVY[0],NAVY[1],NAVY[2]);doc.setLineWidth(.7);doc.roundedRect(M,y,W-2*M,20,2,2);
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(GREYT[0],GREYT[1],GREYT[2]);doc.text('AMOUNT PAID',M+6,y+12);
    doc.setFont('helvetica','bold');doc.setFontSize(18);doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);doc.text(S(money(p.amount)),W-M-6,y+13,{align:'right'});y+=28;
    table(doc,Object.assign({},TBL,{startY:y,theme:'plain',body:[['Bill number',S(b?b.no:'-')],['Payment method',S(p.method)],['Transaction reference',S(p.txRef||'-')],['Paid by',S(p.by||'-')]].concat(p.notes?[['Notes',S(p.notes)]]:[]),columnStyles:{0:{cellWidth:55,textColor:GREYT}},alternateRowStyles:{fillColor:[255,255,255]},styles:{fontSize:10,cellPadding:2.6,lineColor:[209,213,219],lineWidth:{bottom:.1}}}));
    y=endY(doc)+10;
    if(i)y=pdfTotals(doc,y,[{l:'Bill total',v:money(i.total)},{l:'Paid to date',v:money(i.paid)},{l:'Balance remaining',v:money(i.bal),bold:true,big:true,rule:true}]);
    y=Math.max(y+30,200);doc.setDrawColor(17,24,39);doc.setLineWidth(.3);doc.line(M,y,M+70,y);doc.line(W-M-70,y,W-M,y);doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(GREYT[0],GREYT[1],GREYT[2]);doc.text('Authorised signature',M,y+5);doc.text('Received by',W-M-70,y+5);
    pdfFooters(doc,db.settings.business.name+' | '+p.ref);return doc.output('blob');
  })}catch(e){console.error(e);toast('The receipt could not be created: '+(e&&e.message||e),'err');return}
  await saveFile(p.ref+'-receipt.pdf',blob,'application/pdf');
}
async function reportPdf(rep,name){
  const land=rep.cols.length>6;const doc=newPdf({unit:'mm',format:'a4',orientation:land?'landscape':'portrait'});if(!doc)return;let blob;
  try{blob=await withBusy('Preparing PDF',()=>{
    const W=doc.internal.pageSize.getWidth(),M=15,biz=db.settings.business;
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(GREYT[0],GREYT[1],GREYT[2]);doc.text(S(biz.name).toUpperCase(),M,14);
    doc.setFontSize(17);doc.setTextColor(NAVY[0],NAVY[1],NAVY[2]);doc.text(S(rep.title),M,23);
    doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(GREYT[0],GREYT[1],GREYT[2]);
    const sub=[reportSub(rep),rep.summary].filter(Boolean).join('  |  ');doc.text(doc.splitTextToSize(S(sub),W-2*M),M,29);
    const right=c=>c.t==='money'||c.t==='num',hasTot=rep.cols.some(c=>rep.totals[c.k]!=null);
    const cs={};rep.cols.forEach((c,k)=>{if(right(c))cs[k]={halign:'right'}});
    table(doc,Object.assign({},TBL,{startY:36,head:[rep.cols.map(c=>S(c.l))],body:rep.rows.map(r=>rep.cols.map(c=>S(cellText(c,r[c.k])))),
      foot:hasTot?[rep.cols.map((c,k)=>k===0?'Total':rep.totals[c.k]!=null?mnum(rep.totals[c.k]):'')]:undefined,showFoot:'lastPage',
      footStyles:{fillColor:[226,232,240],textColor:[17,24,39],fontStyle:'bold'},columnStyles:cs,styles:Object.assign({},TBL.styles,{fontSize:land?8.5:8.5})}));
    pdfFooters(doc,biz.name+' | '+rep.title);return doc.output('blob');
  })}catch(e){console.error(e);toast('The PDF could not be created: '+(e&&e.message||e),'err');return}
  await saveFile(name+'.pdf',blob,'application/pdf');
}

/* ============================================================
   Sample data, authentication screens, start-up
   ============================================================ */
/* ---------- auth screens ---------- */
function authShell(inner){
  return `<div class="auth"><section class="auth-side"><div class="brand" style="padding:0"><span class="brand-mark">${ic('logo',24)}</span><div><b style="font-size:20px">HotelBills</b><small>Bills and finance</small></div></div>
  <div class="stack" style="gap:28px"><h1>Every bill, payment and rupee, accounted for.</h1><ul class="feat">${[['bill','Bills and billers','Itemised bills, supplier records and automatic totals.'],['card','Full and partial payments','Balances and statuses update the moment a payment is recorded.'],['up','Stock and cash flow','Purchases, usage and money in and out, tied to the same records.'],['pdf','PDF bills and receipts','A4-ready documents generated from your saved data.']].map(f=>`<li><span class="chip">${ic(f[0],18)}</span><span><b>${f[1]}</b><span>${f[2]}</span></span></li>`).join('')}</ul></div>
  <div class="feat" style="color:var(--on-navy);font-size:12.5px">Role-based access for administrators and staff.</div></section>
  <section class="auth-main"><div class="auth-card">${inner}</div></section></div>`;
}
const pwField=(label,name,auto,id)=>`<div class="field"><label for="${id}">${label}</label><div class="pw"><input id="${id}" name="${name}" type="password" autocomplete="${auto}"><button type="button" data-act="toggle-pw" aria-label="Show password">${ic('eye',20)}</button></div></div>`;
function renderAuth(mode,data){
  $('#modals').innerHTML='';MODALS.length=0;document.title='HotelBills';
  let inner='';
  if(mode==='setup')inner=`<div><h2>Set up your workspace</h2><p class="sub">Create the administrator account. Everything is stored in this browser.</p></div>
    <form data-form="setup" novalidate class="stack" style="gap:14px">${errBox()}
    ${F('Hotel or business name','biz','',{req:1,attrs:'autocomplete="organization"'})}${F('Your full name','name','',{req:1,attrs:'autocomplete="name"'})}${F('Email or username','email','',{req:1,attrs:'autocomplete="username"'})}
    ${pwField('Password','password','new-password','su-pw')}${pwField('Confirm password','password2','new-password','su-pw2')}
    <button type="submit" class="btn btn-primary" style="min-height:50px">Create workspace</button></form>
    <div class="note">${ic('info')}<span>Your workspace starts empty. Data and passwords stay in this browser on this device, so download a backup from Settings every week.</span></div>
    <div class="row" style="justify-content:space-between"><span style="color:var(--fg-2)">Already have a backup file?</span><label class="btn btn-sm" for="restore-setup" style="cursor:pointer">${ic('upload',16)}Restore from backup</label><input id="restore-setup" type="file" accept="application/json,.json" class="sr" data-ch="restoresetup"></div>`;
  else if(mode==='login')inner=`<div><h2>Welcome back</h2><p class="sub">Sign in to manage your hotel's bills and payments.</p></div>
    <form data-form="login" novalidate class="stack" style="gap:16px">${errBox()}
    ${F('Email or username','id','',{attrs:'autocomplete="username" autofocus'})}${pwField('Password','password','current-password','li-pw')}
    <div class="row" style="justify-content:space-between"><label class="check"><input type="checkbox" name="remember">Remember me</label><button type="button" class="link" style="min-height:44px" data-act="auth-forgot">Forgot password?</button></div>
    <button type="submit" class="btn btn-primary" style="min-height:50px" id="login-btn">Sign in</button></form>
    <div class="note">${ic('info')}<span>Accounts are created by an administrator. Staff can record bills and payments. Only administrators can delete records or change settings.</span></div>`;
  else if(mode==='forgot')inner=`<button type="button" class="link" data-act="auth-login" style="display:flex;align-items:center;gap:6px;min-height:44px">${ic('chevL',18)}Back to sign in</button><div><h2>Reset your password</h2><p class="sub">Enter your email and the recovery code you saved when the account was created. No email is sent, because this app has no server.</p></div>
    <form data-form="recover" novalidate class="stack" style="gap:14px">${errBox()}${F('Email or username','id','',{attrs:'autocomplete="username"'})}${F('Recovery code','code','',{attrs:'autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX" style="text-transform:uppercase"'})}${pwField('New password','password','new-password','fg-pw')}
    <button type="submit" class="btn btn-primary" style="min-height:50px">Reset password</button></form>
    <div class="note warn">${ic('warn')}<span>Lost the code too? An administrator can set a new password for you in Settings, Users.</span></div>`;
  else if(mode==='recovery')inner=`<div><h2>Save your recovery code</h2><p class="sub">If you forget your password, this code is the only way to reset it yourself. It is shown once.</p></div><div class="code-box" id="rc-code">${esc(data.code)}</div>
    <div class="row"><button type="button" class="btn" data-act="copy-code" data-code="${esc(data.code)}">${ic('copy')}Copy code</button></div>
    <button type="button" class="btn btn-primary" style="min-height:50px" data-act="${data.next}">I have saved it, continue</button>`;
  $('#root').innerHTML=authShell(inner);
  const first=$('#root input:not([type=checkbox])');first&&first.focus({preventScroll:true});
}
ACT['toggle-pw']=el=>{const inp=$('input',el.parentElement),show=inp.type==='password';inp.type=show?'text':'password';el.innerHTML=ic(show?'eyeoff':'eye',20);el.setAttribute('aria-label',show?'Hide password':'Show password')};
ACT['auth-forgot']=()=>renderAuth('forgot');
ACT['auth-login']=()=>renderAuth('login');
let PENDING_USER=null;
ACT['auth-enter']=()=>{if(PENDING_USER){startSession(PENDING_USER,false);PENDING_USER=null}if(me)enterApp();else renderAuth('login')};
async function withButton(form,label,fn){
  const btn=$('button[type=submit]',form),txt=btn.textContent;btn.disabled=true;btn.innerHTML='<span class="spinner sm"></span> '+label;
  try{return await fn()}finally{btn.disabled=false;btn.textContent=txt}
}
FORM.login=async f=>{
  const d=fd(f);if(!String(d.id||'').trim()||!d.password){formErr(f,'Enter your email or username and your password.');return}
  const r=await withButton(f,'Signing in',()=>doLogin(d.id,d.password,!!d.remember));
  if(r.error){formErr(f,r.error);return}enterApp();
};
FORM.setup=async f=>{
  const d=fd(f);
  if(!String(d.biz||'').trim()){formErr(f,'Enter the hotel or business name.');return}
  if(d.password!==d.password2){formErr(f,'The two passwords do not match.');return}
  const r=await withButton(f,'Creating workspace',()=>createUser({name:d.name,email:d.email,role:'admin',password:d.password}));
  if(r.error){formErr(f,r.error);return}
  PENDING_USER=r.user;db=blankDb();db.settings.business.name=String(d.biz).trim();reindex();
  log('create','user',r.user.id,'Created the administrator account');
  save();
  renderAuth('recovery',{code:r.code,next:'auth-enter'});
};
FORM.recover=async f=>{
  const d=fd(f);if(!String(d.id||'').trim()||!d.code||!d.password){formErr(f,'Fill in all three fields.');return}
  const r=await withButton(f,'Resetting',()=>recoverPassword(d.id,d.code,d.password));
  if(r.error){formErr(f,r.error);return}
  renderAuth('recovery',{code:r.code,next:'auth-login'});toast('Password reset. Save the new recovery code, then sign in.','ok');
};

CHANGE.restoresetup=el=>{
  const file=el.files&&el.files[0];if(!file)return;el.value='';
  const rd=new FileReader();rd.onload=()=>{
    let p;try{p=JSON.parse(rd.result)}catch(e){toast('That file is not a valid backup.','err');return}
    const d=p&&p.data;if(!d||!Array.isArray(d.bills)||!Array.isArray(d.billers)||!d.settings){toast('That file is not a HotelBills backup.','err');return}
    if(!Array.isArray(p.users)||!p.users.some(u=>u.role==='admin'&&u.active)){toast('This backup has no accounts. Create the administrator here first, then restore it from Settings.','err');return}
    db=Object.assign(blankDb(),d);db.settings=Object.assign(defaultSettings(),d.settings);db.settings.business=Object.assign(defaultSettings().business,d.settings.business||{});
    users=p.users;saveUsers();NF=null;reindex();save();renderAuth('login');toast('Backup restored. Sign in with your usual email and password.','ok');
  };rd.readAsText(file);
};
/* ---------- start ---------- */
function enterApp(){
  closeAllModals();
  if(!db||!db.settings)loadDb();
  reindex();renderShell();
  let r=location.hash.replace('#','');if(!VIEWS[r])r='dashboard';route=r;renderView();
  log('login','user',me.id,'Signed in');save();
  if(!LS.ok)toast('This browser blocks storage. Changes will be lost when you close the tab, so download backups from Settings.','err');
}
function init(){
  loadDb();loadUsers();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  if(!users.length)renderAuth('setup');
  else if(restoreSession())enterApp();
  else renderAuth('login');
  const b=$('#boot');b&&b.remove();
  window.addEventListener('hashchange',()=>{if(!me||!$('#view'))return;const h=location.hash.replace('#','');if(VIEWS[h]&&h!==route)go(h)});
  setInterval(()=>{if(!me)return;let s=null;try{s=JSON.parse(SS.get(SESS_KEY)||LS.get(SESS_KEY)||'null')}catch(e){}
    if(!s||s.exp<Date.now()){endSession();renderAuth('login');toast('Your session expired. Sign in again.','');return}
    if(!s.remember&&Date.now()-lastActive>30*60000){endSession();renderAuth('login');toast('Signed out after 30 minutes of inactivity.','')}},30000);
}
init();
</script>
